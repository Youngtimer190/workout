<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — treść sięga pod notch/home indicator na iPhone
      WAŻNE: NIE dodajemy maximum-scale=1.0 ani user-scalable=no
      — blokują chowanie paska adresu w Safari
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>FitPlaner – Generator & Planer Treningowy</title>

    <!-- Favicon — emoji bicepsa (fallback dla przeglądarek) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- iOS — ikona na ekranie głównym -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-VQML7p3t.png" />

    <!-- Android PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Safari meta tagi -->
    <!-- apple-mobile-web-app-capable=no — działamy w przeglądarce (nie standalone PWA) -->
    <!-- W trybie standalone Safari inaczej obsługuje pasek adresu -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FitPlaner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f8fafc" />

    <!-- Prevent iOS from styling phone numbers/links -->
    <meta name="format-detection" content="telephone=no" />

tka)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Ławka pod kątem 30-45° celuje w górną część klatki (pars clavicularis). Kluczowe dla pełnego, zaokrąglonego wyglądu klatki.",sets:4,reps:"8-10",restTime:90,notes:"Kąt 30° jest optymalny — wyższy nadmiernie angażuje bark. Gryf opuszczaj na górną część klatki, tuż pod obojczykiem.",requiredEquipment:["barbell","bench"]},{id:"chest-4",name:"Wyciskanie skośne hantlami (górna klatka)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Bezpieczna wersja wyciskania skośnego z lepszą kontrolą i głębszym rozciągnięciem klatki na dole ruchu.",sets:3,reps:"10-12",restTime:75,notes:"Idealne gdy nie masz sparra. Rozciągnij klatkę w dolnym punkcie, ściśnij mocno na górze.",requiredEquipment:["dumbbells","bench"]},{id:"chest-5",name:"Rozpiętki z hantlami na ławce poziomej",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Ćwiczenie izolowane rozciągające klatkę piersiową. Maksymalne rozciągnięcie w ekscentryce stymuluje wzrost sarkomerów.",sets:3,reps:"12-15",restTime:60,notes:"Lekkie ugięcie łokci przez cały ruch (kąt ok. 20°). Opuszczaj powoli kontrolując rozciągnięcie. Nie schodź poniżej poziomu barków.",requiredEquipment:["dumbbells","bench"]},{id:"chest-6",name:"Pompki",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Fundamentalne ćwiczenie z masą ciała. Angażuje klatkę, tricepsy i stabilizatory core. Doskonałe do rozgrzewki i finiszowania.",sets:3,reps:"15-20",restTime:60,notes:"Ciało w jednej linii od głowy do pięt. Ręce na szerokość nieco szerszą niż barki. Pełny zakres ruchu — klatka dotyka podłogi.",requiredEquipment:["bodyweight"]},{id:"chest-7",name:"Pompki na poręczach (klatka)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Pochylenie tułowia do przodu przesuwa akcent na dolną klatkę. Bardzo skuteczne ćwiczenie z masą ciała.",sets:3,reps:"10-15",restTime:75,notes:"Pochyl tułów do przodu o ~30° (dla klatki). Łokcie rozchylone na boki. Pełen zakres — czuj rozciągnięcie klatki na dole.",requiredEquipment:["dip_bars"]},{id:"chest-8",name:"Krzyżowanie linek (wyciąg górny)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Ćwiczenie izolowane na wyciągu utrzymujące stałe napięcie przez cały zakres ruchu. Idealne na koniec treningu klatki.",sets:3,reps:"12-15",restTime:60,notes:"Lekki przechył tułowia do przodu. Skrzyżuj ręce za punktem spotkania dla maksymalnego zacisku. Kontroluj powrót.",requiredEquipment:["cable_machine"]},{id:"chest-9",name:"Pompki odwrócone (Pike Push-Up)",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Pompki w pozycji odwróconego V — głównie angażują przedni i środkowy bark, a w mniejszym stopniu tricepsy. Doskonałe przejście do handstand push-up dla osób trenujących kalistenikę.",sets:3,reps:"10-12",restTime:60,notes:"Biodra wysoko — ciało w kształt odwróconego V (litera A). Głowa zmierza pionowo między dłońmi przy zejściu. Im bardziej pionowe ciało, tym większy nacisk na barki. Progresja: stopy wyżej na podwyższeniu.",requiredEquipment:["bodyweight"]},{id:"back-1",name:"Martwy ciąg konwencjonalny",muscleGroup:"Plecy",difficulty:"Zaawansowany",description:"Najlepsze ćwiczenie na cały tylny łańcuch: prostowniki grzbietu, pośladki, dwugłowe uda, czworoboczny i romboidalne. Fundament siły.",sets:4,reps:"4-6",restTime:180,notes:"Biodra nad kolanami, klatka nad biodrami, wzrok skierowany w przód-dół. Utrzymuj kręgosłup neutralny PRZEZ CAŁY RUCH. Sztanga blisko ciała — po goleniach w górę. Pasek dopiero gdy ciężar przekracza 80% 1RM.",requiredEquipment:["barbell"]},{id:"back-2",name:"Martwy ciąg rumuński (RDL)",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Wariant skupiony na dwugłowych uda i pośladkach z większym rozciągnięciem. Mniej obciążenia dla kręgosłupa niż klasyczny deadlift.",sets:3,reps:"8-12",restTime:120,notes:'Kolana lekko ugięte przez cały ruch. Bioder pchaj do tyłu, nie zaokrąglaj pleców. Sztanga blisko ciała — "zeskrobuje" łydki.',requiredEquipment:["barbell"]},{id:"back-3",name:"Podciąganie na drążku (szerokim chwytem)",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Najlepsze ćwiczenie na szerokość pleców (m. najszerszy). Chwyt szerszy angażuje mocniej latissimus dorsi, węższy — biceps.",sets:4,reps:"6-10",restTime:90,notes:'Inicjuj ruch ściągnięciem łopatek, nie bicepsem. Wyobraź sobie że "łamiesz" drążek rękami. Pełne rozciągnięcie w dolnym punkcie.',requiredEquipment:["pull_up_bar"]},{id:"back-4",name:"Podciąganie neutralnym chwytem",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Chwyt neutralny (dłonie naprzeciw siebie) to najbardziej naturalna pozycja nadgarstka. Mniejsze obciążenie stawu barkowego.",sets:3,reps:"8-12",restTime:90,notes:'Ściągaj łokcie do bioder — wyobraź sobie "wsadzanie łokci do kieszeni spodni". Mocniejszy biceps może pomóc tu niż przy szerokim chwycie.',requiredEquipment:["pull_up_bar"]},{id:"back-5",name:"Wiosłowanie sztangą w opadzie tułowia",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Kluczowe ćwiczenie na grubość pleców: romboidalne, czworoboczny środkowy, najszerszy. Jeden z najlepszych ruchów wioślowania.",sets:4,reps:"8-10",restTime:120,notes:"Tułów pod kątem ~45°, kręgosłup neutralny. Prowadź łokcie blisko ciała i ściągaj je za biodra. Sprowadzaj na dolną część brzucha. NIE kiwaj tułowiem.",requiredEquipment:["barbell"]},{id:"back-29",name:"Wiosłowanie hantlami w skosie",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Wiosłowanie hantlami na ławce skośnej — angażuje najszerszy grzbiet i średnią część pleców. Alternatywa dla wiośłowania sztangą, pozwalająca na niezależną pracę każdej ręki i większy zakres ruchu.",sets:4,reps:"8-12",restTime:90,notes:"Ławka ustawiona pod kątem 30-45°. Hantle trzymaj wzdłuż ciała. Ściągaj łokcie za biodra, nie do klatki. Ściskaj łopatki na górze. Dla trudniejszej wersji można użyć jednej hantli na raz (wiosłowanie jednoręczne).",requiredEquipment:["dumbbells","bench"]},{id:"back-6",name:"Wiosłowanie hantlem jednoręczne",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Jednostronne wiosłowanie eliminuje kompensację słabszej strony. Świetne do korekcji dysbalansów i dużego zakresu ruchu.",sets:3,reps:"10-12 na stronę",restTime:75,notes:"Oprzyj kolano i rękę o ławkę. Hantel ściągaj do bioder, nie do klatki. Rotacja tułowia jest dozwolona i naturalna przy dużych ciężarach.",requiredEquipment:["dumbbells","bench"],isUnilateral:!0},{id:"back-7",name:"Wiosłowanie na wyciągu dolnym (siedzisko)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Bezpieczne i efektywne ćwiczenie na środkową część pleców ze stałym napięciem wyciągu. Dobre dla kręgosłupa.",sets:3,reps:"12-15",restTime:60,notes:"Stopy na podporach, kolana lekko ugięte. Ściągaj uchwyt do pępka. W końcowym punkcie ściskaj łopatki przez 1 sekundę.",requiredEquipment:["cable_machine"]},{id:"back-8",name:"Ściąganie drążka na wyciągu górnym (lat pulldown)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Alternatywa dla podciągań, idealna dla początkujących lub gdy nie można podciągnąć pełnego ciężaru ciała.",sets:3,reps:"12-15",restTime:60,notes:"Uda zaciśnięte pod podporą. Ściągaj drążek do górnej części klatki (nie karku!). Inicjuj ruch łopatkami.",requiredEquipment:["cable_machine"]},{id:"back-9",name:"Wiosłowanie z gumą oporową",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Domowa alternatywa dla wiosłowania. Guma daje zmienne napięcie — większe na końcu ruchu.",sets:3,reps:"15-20",restTime:45,notes:"Przyczep gumę do stabilnego punktu na wysokości pasa. Ściągaj łokcie za siebie, ściskaj łopatki.",requiredEquipment:["resistance_bands"]},{id:"back-10",name:"Hyperextension (prostowanie pleców)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Izolowane ćwiczenie na prostowniki grzbietu i pośladki. Ważne dla zdrowia dolnych pleców i prewencji urazów.",sets:3,reps:"15-20",restTime:60,notes:"Bez dodatkowego ciężaru do opanowania techniki. Nie przeprostowuj w górze — zatrzymaj się gdy ciało jest w jednej linii.",requiredEquipment:["bodyweight"]},{id:"legs-1",name:"Przysiad ze sztangą (back squat)",muscleGroup:"Nogi",difficulty:"Zaawansowany",description:"Król ćwiczeń na nogi angażujący czworogłowe, pośladki, przywodziciele i core. Fundamentalne ćwiczenie dla siły i masy dolnych partii.",sets:4,reps:"5-8",restTime:180,notes:'Stopy na szerokość barków, lekko rozchylone (15-30°). Kolana śledzą kierunek palców. Głębokość minimum równolegle. "Chest up" przez cały ruch.',requiredEquipment:["barbell"]},{id:"legs-2",name:"Przysiad przedni (front squat)",muscleGroup:"Nogi",difficulty:"Zaawansowany",description:"Wariant z większym udziałem czworogłowych i mniejszym obciążeniem kręgosłupa. Wymaga dobrej mobilności nadgarstków i kostek.",sets:4,reps:"5-8",restTime:150,notes:"Łokcie wysoko, klatka prosto. Kolana mocno na zewnątrz przy schodzie. Bardziej pionowy tors niż w back squacie.",requiredEquipment:["barbell"]},{id:"legs-3",name:"Przysiady bułgarskie (Bulgarian Split Squat)",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Jedno z najlepszych jednostronnych ćwiczeń na nogi. Intensywnie angažuje pośladki i czworogłowe, koryguje dysbalanse.",sets:3,reps:"8-10 na nogę",restTime:90,notes:"Tylna noga na ławce (grzbiet stopy). Przednia stopa daleko przed ciałem. Kolano nie wychodzi poza linię palców. Tors lekko pochylony do przodu dla lepszego zaangażowania pośladków.",requiredEquipment:["dumbbells","bench"],isUnilateral:!0},{id:"legs-4",name:"Hip Thrust ze sztangą",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Najskuteczniejsze ćwiczenie na pośladki (m. pośladkowy wielki). Badania EMG potwierdzają największą aktywację gluteus maximus.",sets:4,reps:"10-15",restTime:90,notes:"Łopatki oparte o ławkę (środek łopatek). Broda do klatki. Na górze kolana, biodra i barki w jednej linii. Ściśnij pośladki mocno na 1 sekundę.",requiredEquipment:["barbell","bench"]},{id:"legs-5",name:"Martwy ciąg rumuński z hantlami (RDL)",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Doskonałe ćwiczenie na dwugłowe uda i pośladki. Wersja z hantlami daje większy zakres ruchu i elastyczność ustawienia.",sets:3,reps:"10-12",restTime:90,notes:"Hantle blisko ciała przez cały ruch. Czuj rozciągnięcie dwugłowych na dole. Inicjuj powrót napierając biodrami do przodu.",requiredEquipment:["dumbbells"]},{id:"legs-6",name:"Prasa do nóg",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Bezpieczna alternatywa dla przysiadu gdy masz problemy z kręgosłupem lub słabą techniką. Pozwala na bardzo duże obciążenia czworogłowych przy minimalnym obciążeniu kręgosłupa.",sets:4,reps:"10-15",restTime:90,notes:"Stopy wyżej = większy udział pośladków i dwugłowych. Stopy niżej = więcej czworogłowych. NIE blokuj kolan na górze. Pełen zakres ruchu.",requiredEquipment:["leg_press"]},{id:"legs-7",name:"Wykroki chodzące z hantlami",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Dynamiczne wykroki angażujące czworogłowe, pośladki i stabilizatory. Poprawiają balans i koordynację.",sets:3,reps:"12 kroków na nogę",restTime:75,notes:"Długi krok, kolano tylnej nogi prawie dotyka podłogi. Tors prosto. Krok rób z piętą wiodącą nogi.",requiredEquipment:["dumbbells"],isUnilateral:!0},{id:"legs-8",name:"Wspięcia na palce ze sztangą (łydki)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Izolowane ćwiczenie na mięśnie łydek (gastrocnemius i soleus). Łydki często zaniedbywane, kluczowe dla wyglądu nóg.",sets:4,reps:"12-20",restTime:60,notes:"Pełen zakres — od maksymalnego rozciągnięcia do maksymalnego zacisku. Wolne tempo. Stopa na krawędzi podwyższenia dla głębszego rozciągnięcia.",requiredEquipment:["barbell"]},{id:"legs-9",name:"Uginanie nóg leżąc (leg curl)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Izolowane ćwiczenie na dwugłowe uda (hamstrings). Ważne dla balansu siły między czworogłowymi a dwugłowymi.",sets:3,reps:"12-15",restTime:60,notes:"Biodra dociśnięte do maszyny przez cały ruch. Powolna ekscentryka (3 sekundy). Nie zrywaj ciężaru.",requiredEquipment:["leg_curl_machine"]},{id:"legs-10",name:"Przysiad z masą ciała",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Podstawowa forma przysiadu bez obciążenia. Idealna do nauki wzorca ruchowego, rozgrzewki i treningu domowego. Angażuje czworogłowe, pośladki i stabilizatory.",sets:3,reps:"20-25",restTime:45,notes:"Stopy na szerokość barków, palce lekko rozchylone. Tors możliwie pionowy, klatka prosto. Kolana aktywnie na zewnątrz — nie zawijaj do środka. Schodź co najmniej do równoległości. Dobre ćwiczenie rozgrzewkowe i uzupełniające.",requiredEquipment:["bodyweight"]},{id:"legs-11",name:"Prostowanie nóg na maszynie (leg extension)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Izolowane ćwiczenie na mięsień czworogłowy uda. Pozwala na precyzyjną izolację i pracę do upadku mięśniowego. Używaj jako ćwiczenie końcowe lub pre-exhaust przed przysiadami.",sets:3,reps:"12-15",restTime:60,notes:"Ustaw maszynę tak by oś obrotu była przy kolanie. Powolna ekscentryka (2-3 sek). Zaciśnij czworogłowe w górnym punkcie przez 1 sekundę. Nie używaj zamachu — to ćwiczenie izolowane.",requiredEquipment:["leg_curl_machine"]},{id:"shoulders-1",name:"Wyciskanie żołnierskie (OHP) ze sztangą",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Fundamentalne ćwiczenie na barki w pozycji stojącej. Angażuje cały bark, tricepsy i wymaga stabilizacji core. Jeden z Big Four lifts.",sets:4,reps:"6-10",restTime:120,notes:"Chwyć sztangę na szerokość barków. Na starcie gryf na górze klatki. Głowa cofa się gdy sztanga przechodzi obok twarzy. Brzuch napięty — nie wyginaj lędźwi!",requiredEquipment:["barbell"]},{id:"shoulders-2",name:"Wyciskanie hantli nad głowę (siedząc)",muscleGroup:"Barki",difficulty:"Początkujący",description:"Bezpieczniejsza dla kręgosłupa wersja wyciskania nad głowę. Każde ramię niezależne — eliminuje dysbalanse.",sets:3,reps:"10-12",restTime:90,notes:'Łokcie ustawione w kształt "W" (nie przed torsem, nie prosto w bok). Na górze nie stykaj hantlami — utrzymaj napięcie.',requiredEquipment:["dumbbells","bench"]},{id:"shoulders-3",name:"Unoszenie hantli bokiem (lateral raise)",muscleGroup:"Barki",difficulty:"Początkujący",description:"Jedyne skuteczne izolowane ćwiczenie na środkowy bark (deltoid medialny), który daje szerokość ramion.",sets:4,reps:"15-20",restTime:60,notes:"Lekki przechyl do przodu (15°). Kciuk lekko w dół (jak wylewanie wody ze szklanki). NIE unoś powyżej poziomu barku. Bardzo lekki ciężar, wysoka objętość.",requiredEquipment:["dumbbells"]},{id:"shoulders-4",name:"Face Pulls na wyciągu",muscleGroup:"Barki",difficulty:"Początkujący",description:"Kluczowe ćwiczenie dla zdrowia barków — wzmacnia tylny bark i zewnętrzne rotatory (infraspinatus, teres minor). Prewencja urazów.",sets:3,reps:"15-20",restTime:45,notes:"Wyciąg na wysokości twarzy. Ściągaj do uszu, łokcie wysoko. Rozwieraj ręce jak skrzydła. Obowiązkowe dla każdego kto dużo wyciska.",requiredEquipment:["cable_machine"]},{id:"shoulders-5",name:"Wznosy hantli przodem",muscleGroup:"Barki",difficulty:"Początkujący",description:"Ćwiczenie na przedni bark (deltoid anterior). Uwaga: przednie barki dostają duże pobudzenie przy wyciskaniach — nie przesadzaj z objętością.",sets:3,reps:"12-15",restTime:60,notes:"Naprzemiennie lub obie ręce. Unoś do wysokości oczu. Powolna ekscentryka. Nie kołysz tułowiem.",requiredEquipment:["dumbbells"]},{id:"shoulders-6",name:"Wznosy ramion z gumą oporową",muscleGroup:"Barki",difficulty:"Początkujący",description:"Domowa alternatywa dla unoszenia bocznego. Guma daje wyższe napięcie gdy bark jest najbardziej aktywny.",sets:3,reps:"15-20",restTime:45,notes:"Nastąp na środek gumy, uchwyć końce. Unoś bokiem do poziomu barków. Dobre na rozgrzewkę stawów barkowych.",requiredEquipment:["resistance_bands"]},{id:"shoulders-7",name:"Arnoldpress z hantlami",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Wymyślony przez Schwarzeneggera wariant wyciskania z rotacją angażujący wszystkie trzy głowy deltoidu.",sets:3,reps:"10-12",restTime:90,notes:"Start z dłońmi do twarzy, łokcie przed torsem. Rotuj na zewnątrz podczas wyciskania. Pełen zakres ruchu jest kluczowy.",requiredEquipment:["dumbbells","bench"]},{id:"biceps-1",name:"Uginanie ramion ze sztangą stojąc",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Klasyczne ćwiczenie na biceps pozwalające na największe obciążenie. Angażuje oba brzuśce bicepsa brachii i brachialis.",sets:3,reps:"8-10",restTime:75,notes:"Łokcie przy tułowiu przez cały ruch. Supinacja nadgarstka na górze (odwróć dłonie). Pełen zakres — od pełnego wyprostu do maksymalnego zagięcia. Nie kołysz się!",requiredEquipment:["barbell"]},{id:"biceps-2",name:"Uginanie naprzemienne z hantlami",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Naprzemienne uginanie pozwala skupić się na jednym ramieniu i na supinacji nadgarstka — kluczowej dla szczytu bicepsa.",sets:3,reps:"10-12 na rękę",restTime:60,notes:"Supinuj nadgarstek podczas ugięcia — kciuk na zewnątrz. Trzymaj łokieć nieruchomo. Powolna ekscentryka (3 sek) dla większej stymulacji.",requiredEquipment:["dumbbells"]},{id:"biceps-3",name:"Uginanie młotkowe (hammer curl)",muscleGroup:"Biceps",difficulty:"Początkujący",description:'Chwyt neutralny mocniej angażuje brachialis (pod bicepsem) i brachioradialis. Daje "grubość" ramienia i siłę.',sets:3,reps:"10-12",restTime:60,notes:"Dłonie zwrócone do siebie przez cały ruch (jak trzymanie młotka). Możesz robić naprzemiennie lub obu jednocześnie.",requiredEquipment:["dumbbells"]},{id:"biceps-4",name:"Uginanie na wyciągu dolnym",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Wyciąg dolny utrzymuje stałe i wysokie napięcie w dolnej fazie ruchu gdzie wolne ciężary mają napięcie bliskie zero. Świetne uzupełnienie.",sets:3,reps:"12-15",restTime:60,notes:"Stój dalej od maszyny dla lepszego kąta napięcia. Trzymaj łokcie przy ciele. Powolna ekscentryka.",requiredEquipment:["cable_machine"]},{id:"biceps-5",name:"Uginanie ramion z gumą oporową",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Domowy odpowiednik curl. Guma daje progresywne napięcie.",sets:3,reps:"15-20",restTime:45,notes:"Nastąp na gumę stopami. Trzymaj łokcie stabilnie przy ciele. Koncentruj się na supinacji.",requiredEquipment:["resistance_bands"]},{id:"biceps-6",name:"Uginanie ramion na modlitewniku (preacher curl)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Modlitewnik eliminuje bujanie i izoluje biceps. Szczególnie skuteczne na dolną część brzuśca bicepsa.",sets:3,reps:"10-12",restTime:75,notes:"Ramię pełnie oparte na podkładce. Pełen zakres — NIE blokuj łokcia w dole. Powolna ekscentryka kluczowa tu.",requiredEquipment:["barbell","bench"]},{id:"triceps-1",name:"Wyciskanie wąskim chwytem",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Najlepsze ćwiczenie wielostawowe na triceps. Pozwala na duże obciążenia angażując wszystkie trzy głowy — szczególnie głowę długą.",sets:3,reps:"8-10",restTime:90,notes:"Chwyt na szerokość barków (nie za wąski — nie torturuj nadgarstków). Łokcie blisko tułowia, nie rozchylaj na zewnątrz. Gryf do dolnej części klatki.",requiredEquipment:["barbell","bench"]},{id:"triceps-2",name:"Prostowanie ramion na wyciągu (pushdown)",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Klasyczne izolowane ćwiczenie na triceps z wyciągiem górnym. Stałe napięcie przez cały zakres — doskonałe do pompowania krwi.",sets:3,reps:"12-15",restTime:60,notes:"Łokcie przy ciele przez cały ruch (to ważne!). Pełny wyprost — zaciśnij tricepsy mocno. Nie kołysz tułowiem. Wypróbuj różne uchwyty (linka, prosty, V-bar).",requiredEquipment:["cable_machine"]},{id:"triceps-3",name:"French press (łamanie) ze sztangą leżąc",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Skuteczne ćwiczenie izolowane angażujące głowę długą tricepsa (największa z trzech). Kluczowe dla masy tricepsa.",sets:3,reps:"10-12",restTime:75,notes:"Łokcie nieruchome, skierowane w sufit przez cały ruch. Opuszczaj za głowę (nie na czoło) dla pełniejszego rozciągnięcia. Lekki ciężar na początek.",requiredEquipment:["barbell","bench"]},{id:"triceps-4",name:"Dipy na poręczach (wąskie, triceps)",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Ciężkie ćwiczenie z masą ciała na triceps. Pionowy tors minimalizuje udział klatki i skupia pracę na tricepsach.",sets:3,reps:"10-15",restTime:75,notes:"Tors pionowo (w przeciwieństwie do dipów na klatkę). Łokcie blisko ciała. Pełen zakres — ramię prostopadłe do podłogi na dole.",requiredEquipment:["dip_bars"]},{id:"triceps-5",name:"Pompki wąskim chwytem",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Wersja pompek z naciskiem na triceps. Nie wymaga sprzętu — idealne do treningu domowego i finiszowania.",sets:3,reps:"12-15",restTime:60,notes:"Ręce na szerokość barków lub nieco wężej. Łokcie blisko tułowia przy zejściu. Kontroluj każde powtórzenie.",requiredEquipment:["bodyweight"]},{id:"triceps-6",name:"Prostowanie ramion z hantlem nad głową",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Ćwiczenie nad głową maksymalnie rozciąga głowę długą tricepsa — tę najtrudniej rozwinąć. Bardzo efektywne izolowane ćwiczenie.",sets:3,reps:"12-15",restTime:60,notes:"Trzymaj jeden koniec hantla oburącz za głową. Łokcie wąsko, skierowane w sufit. Rozciągnij triceps w dole i ściśnij na górze.",requiredEquipment:["dumbbells"]},{id:"triceps-7",name:"Prostowanie ramion z gumą",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Domowy pushdown z gumą oporową przypiętą nad głową.",sets:3,reps:"15-20",restTime:45,notes:"Przyczep gumę do góry (drzwi, drążek). Łokcie przy ciele. Pełen zakres ruchu.",requiredEquipment:["resistance_bands"]},{id:"core-1",name:"Plank (deska)",muscleGroup:"Brzuch",difficulty:"Początkujący",description:"Fundamentalne ćwiczenie izometryczne wzmacniające głęboki stabilizator kręgosłupa (m. poprzeczny brzucha), rektus i skośne.",sets:3,reps:"45-60 sek",restTime:45,notes:"Ciało w idealnej linii od głowy do pięt. Napnij brzuch, pośladki i uda jednocześnie. Oddychaj normalnie. Jakość > czas.",requiredEquipment:["bodyweight"]},{id:"core-2",name:"Unoszenie nóg w zwisie",muscleGroup:"Brzuch",difficulty:"Zaawansowany",description:"Jedno z najefektywniejszych ćwiczeń na dolną partię brzucha i hip flexors. Wymaga silnego chwytu i stabilności.",sets:3,reps:"10-15",restTime:60,notes:"Unikaj wahadłowego bujania. Nogi wyprostowane lub lekko ugięte. W górnym punkcie zaciśnij brzuch. Powolna ekscentryka.",requiredEquipment:["pull_up_bar"]},{id:"core-3",name:"Russian Twist z ciężarem",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Rotacyjne ćwiczenie na skośne mięśnie brzucha. Ważne dla sportowej sylwetki i siły rotacyjnej.",sets:3,reps:"20 (10 na stronę)",restTime:45,notes:"Tułów pod kątem ~45°, stopy uniesione dla trudniejszej wersji. Ruch rotacyjny pochodzi z talii, nie ramion. Trzymaj ciężar blisko ciała.",requiredEquipment:["bodyweight"]},{id:"core-4",name:"Ab Wheel Rollout",muscleGroup:"Brzuch",difficulty:"Zaawansowany",description:"Jedno z najtrudniejszych ćwiczeń na core — angażuje cały anterior core w ruchu dynamicznym. Ekstremalny bodziec dla mięśni głębokich.",sets:3,reps:"8-12",restTime:60,notes:"Zacznij od krótkiego zakresu ruchu. Brzuch napięty jak przed uderzeniem. NIE wygniaj lędźwi. Wróć siłą brzucha, nie bioder.",requiredEquipment:["bodyweight"]},{id:"core-5",name:"Crunch na maszynie (cable crunch)",muscleGroup:"Brzuch",difficulty:"Początkujący",description:"Jedyne ćwiczenie brzucha z progresją obciążenia. Pozwala na systematyczne przeciążanie prostownika brzucha jak każdy inny mięsień.",sets:3,reps:"15-20",restTime:45,notes:"Klęcz, trzymaj linę przy głowie. Zginaj w talii ku biodrom — NIE szarpaj ramionami. Poczuj spalanie w brzuchu na każdym powtórzeniu.",requiredEquipment:["cable_machine"]},{id:"core-6",name:"Nożyczki (flutter kicks)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Ciągłe napięcie dolnego brzucha i hip flexorów. Dobre uzupełnienie dla planku i unoszenia nóg.",sets:3,reps:"30 sek",restTime:45,notes:"Plecy płasko na podłodze (lub lekko uniesione). Nogi nisko nad ziemią. Tempo równomierne, bez przerw.",requiredEquipment:["bodyweight"]},{id:"cardio-1",name:"Bieg interwałowy HIIT",muscleGroup:"Cardio",difficulty:"Zaawansowany",description:"Naprzemienne sprinting (30 sek) i marsz (90 sek). Spalanie kalorii przez 24-48h po treningu (efekt EPOC). Najskuteczniejszy rodzaj cardio.",sets:1,reps:"",duration:20,restTime:0,notes:"5 min rozgrzewka + 8-10 interwałów (30 sek sprint / 90 sek marsz) + 5 min wyciszenie. Nie rób częściej niż 3x/tydzień.",requiredEquipment:["treadmill"]},{id:"cardio-2",name:"Bieg ciągły (LISS)",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Cardio o stałej, umiarkowanej intensywności (65-70% max tętna). Nie interferuje z regeneracją mięśni — bezpieczne uzupełnienie treningu siłowego.",sets:1,reps:"",duration:30,restTime:0,notes:"Tempo konwersacyjne — możesz rozmawiać w zdaniach. Idealne rano na czczo lub w dni bez treningu siłowego.",requiredEquipment:["treadmill"]},{id:"cardio-3",name:"Rower stacjonarny",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Niskoudarowe cardio oszczędzające stawy kolanowe i biodrowe. Idealne przy kontuzjach nóg lub jako aktywna regeneracja.",sets:1,reps:"",duration:40,restTime:0,notes:"Regulacja wysokości siodełka: lekkie ugięcie kolana w dolnym punkcie pedałowania. Utrzymuj stałe RPM 70-90.",requiredEquipment:["stationary_bike"]},{id:"cardio-4",name:"Ergometr wioślarski",muscleGroup:"Cardio",difficulty:"Średniozaawansowany",description:"Całociałowe cardio angażujące 86% mięśni. Łączy cardio z siłą — spalanie wyższe niż bieg przy mniejszym obciążeniu stawów.",sets:1,reps:"",duration:25,restTime:0,notes:"Sekwencja: nogi → tułów → ramiona. Powrót: ramiona → tułów → nogi. Unikaj okrągłych pleców. Docelowe SPM: 24-28.",requiredEquipment:["rowing_machine"]},{id:"cardio-5",name:"Skakanka (jump rope)",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Niedoceniane cardio angażujące łydki, ramiona i koordynację. Spala ~10 kcal/min — skuteczniejsze niż bieg.",sets:3,reps:"3 min",duration:15,restTime:60,notes:"Zacznij od prostych skoków obunóż. Ląduj miękko na przodostopiu, kolana lekko ugięte. Przerwy 60 sek między rundami.",requiredEquipment:["jump_rope"]},{id:"fullbody-1",name:"Kettlebell Swing",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Dynamiczne ćwiczenie balistyczne angażujące pośladki, dwugłowe uda, plecy i barki w jednym eksplozywnym ruchu. Łączy siłę i cardio.",sets:4,reps:"15-20",restTime:60,notes:"Ruch pochodzi z bioder (hip hinge), NIE z ramion. Pchaj biodra do przodu eksplozywnie. Kettlebell unoszona siłą bioder, nie mięśni ramion.",requiredEquipment:["kettlebell"]},{id:"fullbody-2",name:"Clean & Press z hantlami",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Olimpijskie ćwiczenie pełnociałowe łączące zarzut (clean) z wyciskaniem. Niezwykły bodziec dla całego ciała i układu nerwowego.",sets:4,reps:"6-8",restTime:120,notes:"Naucz się cleana i pressa osobno zanim połączysz. Eksplozja z bioder przy cleanie. Stabilizuj core przy pressie.",requiredEquipment:["dumbbells"]},{id:"fullbody-3",name:"Burpees",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Kompleksowe ćwiczenie cardio-siłowe bez sprzętu. Angażuje klatę, tricepsy, core, nogi i układ krążenia. Idealne do finiszowania treningu.",sets:4,reps:"10-15",restTime:60,notes:"Pompka w dole jest opcjonalna dla większej intensywności. Utrzymuj tempo — nie pędź aż tracisz formę. Zmodyfikuj (bez skoku) jeśli masz problemy ze stawami.",requiredEquipment:["bodyweight"]},{id:"fullbody-4",name:"Turkish Get Up (TGU)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Jedno z najkompleksowszych ćwiczeń — mobilność, stabilność, siła i koordynacja w jednym ruchu. Idealne narzędzie rehabilitacji i prewencji.",sets:3,reps:"5 na stronę",restTime:90,notes:"Naucz się każdej fazy osobno (7 kroków). Wzrok na kettlebell przez cały ruch. Jakość absolutnie ważniejsza niż ciężar.",requiredEquipment:["kettlebell"]},{id:"fullbody-5",name:"Martwy ciąg sumo z hantlami",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Martwy ciąg z hantlami w szerokim rozkroku — angażuje przywodziciele, pośladki, dwugłowe uda i prostowniki grzbietu. Technicznie prostszy od sztangi, bezpieczny dla kręgosłupa.",sets:3,reps:"12-15",restTime:75,notes:"Stopy szeroko, palce rozchylone na zewnątrz. Hantle między nogami. Kręgosłup neutralny. Biodra inicjują ruch w górę.",requiredEquipment:["dumbbells"]},{id:"fullbody-6",name:"Bear Crawl",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Czworakowanie niedźwiedzia — angażuje core, barki, biodra i poprawia koordynację. Odbudowuje wzorce ruchowe.",sets:3,reps:"30 sek",restTime:60,notes:"Kolana 2-3 cm nad podłogą. Naprzemienne ruchy (prawa ręka + lewa noga). Biodra nie kołyszą się na boki. Powoli i kontrolowanie.",requiredEquipment:["bodyweight"]},{id:"chest-10",name:"Wyciskanie dolne hantlami (ujemny kąt ławki)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Ławka ustawiona pod kątem -15° do -30° celuje w dolną część klatki piersiowej — partię trudną do wyizolowania. Daje wyraźną dolną granicę klatki.",sets:3,reps:"10-12",restTime:90,notes:"Upewnij się że stopy są zakotwione. Łopatki ściągnięte przez cały ruch. Nie stosuj przy problemach z ciśnieniem krwi.",requiredEquipment:["dumbbells","bench"]},{id:"chest-11",name:"Rozpiętki skośne (górna klatka)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Izolowane rozciąganie górnej części klatki piersiowej. Maksymalne rozciągnięcie w ekscentryce przy kącie 30-45° stymuluje pars clavicularis.",sets:3,reps:"12-15",restTime:60,notes:"Lekki ciężar, kontrolowany ruch. Ugięcie łokci ok 15-20°. Rozciągnij głęboko — poczuj rozciąganie w górnej klatce.",requiredEquipment:["dumbbells","bench"]},{id:"chest-12",name:"Krzyżowanie linek dolnych (wyciąg dolny)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Wyciąg z dolnej pozycji angażuje górną klatkę pod innym kątem niż wersja górna. Świetne uzupełnienie dla pełnego rozwoju klatki.",sets:3,reps:"12-15",restTime:60,notes:"Stój pośrodku wyciągu. Ręce prowadź ku górze i do środka. Zaciśnij klatkę w górnym punkcie przez 1 sekundę.",requiredEquipment:["cable_machine"]},{id:"chest-13",name:"Pompki na podwyższeniu (górna klatka)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Nogi na podwyższeniu przenoszą obciążenie na górną część klatki — odpowiednik wyciskania skośnego, ale bez sprzętu.",sets:3,reps:"12-15",restTime:60,notes:"Im wyżej nogi, tym więcej górnej klatki i barków. Ręce na ziemi, ciało proste jak deska. Pełen zakres ruchu.",requiredEquipment:["bodyweight"]},{id:"chest-14",name:"Svend Press (ściskanie talerzy)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Ściskanie dwóch talerzy dłońmi przy wyciskaniu. Stałe napięcie czyni je doskonałym ćwiczeniem izolowanym na przywodziciele klatki.",sets:3,reps:"15-20",restTime:45,notes:"Ściskaj talerze tak mocno jak możesz przez cały ruch. Powolne tempo — czuj każdy centymetr. Ciężar nie jest istotny, liczy się napięcie.",requiredEquipment:["barbell"]},{id:"chest-15",name:"Wyciskanie maszyna (Hammer Strength)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Maszyna prowadzona po naturalnym łuku ruchu. Bezpieczna do trenowania do upadku mięśniowego bez sparra. Dobra na pompowanie końcowe.",sets:3,reps:"12-15",restTime:75,notes:"Ustaw siedzisko tak by dłonie były na wysokości klatki. Pełen zakres — nie zatrzymuj ruchu w połowie drogi.",requiredEquipment:["cable_machine"]},{id:"back-11",name:"Wiosłowanie maszyna (Hammer Strength)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Wiosłowanie na maszynie z naturalnym prowadzeniem. Bezpieczne i efektywne — idealne do finalnego pompowania pleców lub dla początkujących.",sets:3,reps:"12-15",restTime:75,notes:"Klatka piersiowa oparta o podkładkę przez cały ruch. Ściągaj łokcie za siebie maksymalnie. Ściskaj łopatki w końcowym punkcie.",requiredEquipment:["cable_machine"]},{id:"back-12",name:"Ściąganie ramion (shrugs) ze sztangą",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Izolowane ćwiczenie na mięsień czworoboczny górny (trapez). Buduje masywną górną część pleców i szyi — ważne dla atletycznej sylwetki.",sets:4,reps:"12-15",restTime:60,notes:"NIE obracaj ramion — prosty ruch w górę i w dół. Zaciśnij trapez na 1-2 sekundy w górze. Duże obciążenie, wolne tempo.",requiredEquipment:["barbell"]},{id:"back-13",name:"Shrugs z hantlami",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Wersja wznosów barków z hantlami — większy zakres ruchu i bardziej naturalne ustawienie dłoni. Mniejsze obciążenie stawu barkowego.",sets:3,reps:"15-20",restTime:60,notes:"Ręce wzdłuż tułowia. Wznoś barki prosto w górę — wyobraź sobie że chcesz dotknąć barkami uszu. Pełne rozluźnienie w dole.",requiredEquipment:["dumbbells"]},{id:"back-14",name:"Inwertowane wiosłowanie (Australian pull-up)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Wiosłowanie własnym ciałem pod poziomą poprzeczką. Doskonałe ćwiczenie przejściowe przed podciąganiem — reguluje trudność kątem ciała.",sets:3,reps:"12-15",restTime:75,notes:"Im bardziej poziomo ciało, tym trudniej. Zacznij pod kątem 45°. Ściągaj klatkę do poprzeczki. Core napięty przez cały ruch.",requiredEquipment:["pull_up_bar"]},{id:"back-15",name:"Wiosłowanie T-bar",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Wiosłowanie na specjalnym uchwycie T-bar lub z jednym końcem sztangi w narożniku. Wyjątkowe ćwiczenie na środkową grubość pleców.",sets:4,reps:"8-10",restTime:120,notes:"Tors pod kątem ~45°. Neutralny chwyt (dłonie naprzeciw siebie). Ściągaj do brzucha. Nie kiwaj torsem — izoluj plecy.",requiredEquipment:["barbell"]},{id:"back-16",name:"Ściąganie liny na wyciągu górnym",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Wariant lat pulldown z liną. Neutralny chwyt i możliwość rozdzielenia rąk w dolnym punkcie daje mocniejszy zacisk mięśnia najszerszego.",sets:3,reps:"12-15",restTime:60,notes:"W dolnym punkcie rozdziel ręce i ściągnij łokcie za ciało. Linia biegnąca za głowę nie jest zalecana — tylko przed klatką.",requiredEquipment:["cable_machine"]},{id:"back-17",name:"Martwy ciąg z hantlami",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Wersja martwego ciągu z hantlami — łatwiejsza technicznie i bezpieczniejsza dla kręgosłupa. Idealna dla początkujących do nauki wzorca hip hinge.",sets:3,reps:"10-12",restTime:90,notes:"Hantle blisko ciała przez cały ruch. Kręgosłup neutralny — nie zaokrąglaj. Biodra inicjują ruch zarówno w dół jak i w górę.",requiredEquipment:["dumbbells"]},{id:"back-18",name:"Good Morning ze sztangą",muscleGroup:"Plecy",difficulty:"Zaawansowany",description:"Ćwiczenie na prostowniki grzbietu, pośladki i dwugłowe uda z obciążeniem na barkach. Wzmacnia tylny łańcuch i poprawia technikę martwego ciągu.",sets:3,reps:"8-12",restTime:120,notes:"Lekki ciężar — to ćwiczenie techniczne! Kolana lekko ugięte. Wypychaj biodra do tyłu, nie zginaj kręgosłupa. Zatrzymaj gdy tors jest równoległy do podłogi.",requiredEquipment:["barbell"]},{id:"legs-12",name:"Przysiad sumo ze sztangą",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Szeroki rozstaw stóp i palce mocno skierowane na zewnątrz angażują bardziej przywodziciele i pośladki niż klasyczny squat.",sets:4,reps:"8-12",restTime:120,notes:"Kolana aktywnie pchaj na zewnątrz przez cały ruch. Tors bardziej pionowy niż w back squacie. Głębokość minimum równolegle.",requiredEquipment:["barbell"]},{id:"legs-13",name:"Przysiad z hantlami (goblet squat)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Przysiad z hantlem trzymanym przy klatce piersiowej. Naturalne wyważenie ciężaru poprawia postawę i głębokość przysiadu.",sets:3,reps:"15-20",restTime:60,notes:"Trzymaj hantel pionowo oburącz przy mostku. Łokcie w dole dotykają wnętrza kolan. Klatka prosto przez cały ruch.",requiredEquipment:["dumbbells"]},{id:"legs-14",name:"Wykroki z hantlami w miejscu",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Statyczne wykroki angażujące czworogłowe i pośladki. Łatwiejsze do kontrolowania niż chodzące — lepsze dla początkujących lub przy problemach z balansem.",sets:3,reps:"10-12 na nogę",restTime:75,notes:"Stopa przednia płasko, stopa tylna na palcach. Kolano tylnej nogi 2-3 cm nad podłogą. Tors prosto przez cały ruch.",requiredEquipment:["dumbbells"],isUnilateral:!0},{id:"legs-15",name:"Sumo deadlift (szeroki chwyt)",muscleGroup:"Nogi",difficulty:"Zaawansowany",description:"Wariant martwego ciągu z szerokim rozstawem stóp. Mniejszy zakres ruchu, większy udział przywodzicieli i pośladków, mniejsze obciążenie kręgosłupa.",sets:4,reps:"4-6",restTime:180,notes:"Stopy szeroko, chwyt wąski (między kolanami). Kolana pchaj na zewnątrz przez cały czas. Biodra nisko na starcie.",requiredEquipment:["barbell"]},{id:"legs-16",name:"Krok w górę na skrzynię (step-up)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Funkcjonalne ćwiczenie na czworogłowe i pośladki. Poprawia balans, koordynację i siłę jednostronną. Doskonałe jako uzupełnienie przysiadów.",sets:3,reps:"12 na nogę",restTime:60,notes:"Staw skoku w górę siłą przedniej nogi — nie odpychaj się tylną. Wysoka skrzynia = więcej pośladków. Tors prosto.",requiredEquipment:["bodyweight"]},{id:"legs-17",name:"Wspięcia na palce siedząc (maszyna)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Izolowane ćwiczenie na soleus — głębszy mięsień łydki. Pozycja siedząca z ugiętymi kolanami wyłącza gastrocnemius i izoluje soleus. Kluczowe dla pełnego rozwoju łydki.",sets:4,reps:"15-25",restTime:45,notes:"Połóż ciężar (lub specjalny pad maszyny) na kolanach. Pełen zakres — od maksymalnego rozciągnięcia pięty w dół do maksymalnego zacisku na palcach. Powolne tempo, bez sprężynowania. 2 sekundy w górze.",requiredEquipment:["leg_curl_machine"]},{id:"legs-18",name:"Nordic Curl (uginanie nóg z partnerem)",muscleGroup:"Nogi",difficulty:"Zaawansowany",description:"Ekscentryczne ćwiczenie na dwugłowe uda z masą ciała. Jedno z najskuteczniejszych ćwiczeń hamstringów — stosowane w prewencji kontuzji przez sportowców.",sets:3,reps:"5-8",restTime:120,notes:"Partner przytrzymuje kostki. Opuszczaj ciało wolno (3-5 sek), trzymając plecy proste. Użyj rąk do odciągnięcia się od podłogi na dole.",requiredEquipment:["bodyweight"]},{id:"legs-19",name:"Przysiad boczny (lateral squat)",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Przysiad w płaszczyźnie czołowej angażujący przywodziciele i abduktory. Często pomijane ćwiczenie rozwijające wszechstronność ruchową nóg.",sets:3,reps:"10 na stronę",restTime:60,notes:"Stopy szeroko, palce prosto. Pchaj biodra na bok i w dół do jednej nogi. Druga noga prosta. Kolano nad palcami.",requiredEquipment:["bodyweight"]},{id:"legs-20",name:"Hip Thrust jednostronny z hantlem",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Jednostronny hip thrust intensywnie izoluje jeden pośladek. Eliminuje dysbalanse siłowe i lateralne — świetne uzupełnienie klasycznego hip thrust.",sets:3,reps:"12-15 na stronę",restTime:75,notes:"Łopatki na ławce, jedna noga w górze. Biodro odpychaj ku sufitowi — zaciśnij pośladek na 2 sekundy. Kolano nogi opierającej pod kątem 90°.",requiredEquipment:["dumbbells","bench"]},{id:"legs-21",name:"Abdukcja bioder na maszynie",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Izolowane ćwiczenie na mięsień pośladkowy średni i mały — odpowiedzialne za kształt pośladków i stabilność biodrową podczas chodu i biegu.",sets:3,reps:"15-20",restTime:45,notes:"Siedź prosto, plecy przy oparciu. Rozchylaj nogi siłą pośladków, nie ud. Powolna ekscentryka — nie pozwól maszynie ściągnąć nóg zbyt szybko. Zatrzymaj się na 1 sekundę w maksymalnym rozchyleniu.",requiredEquipment:["cable_machine"]},{id:"legs-22",name:"Wspięcia na palce jednonóż",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Jednostronne wspięcia podwajają obciążenie na każdą łydkę i wymagają większej kontroli balansu. Szybszy sposób na rozwinięcie łydek niż wersja obustronna.",sets:3,reps:"15-20 na nogę",restTime:60,notes:"Stój na krawędzi schodka lub podwyższenia. Trzymaj się czegoś dla balansu. Pełen zakres od maks. rozciągnięcia do maks. zacisku.",requiredEquipment:["bodyweight"],isUnilateral:!0},{id:"shoulders-8",name:"Wyciskanie żołnierskie hantlami stojąc",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Stojące wyciskanie hantli nad głowę angażuje core i stabilizatory. Funkcjonalniejsze niż wersja siedząca — większe zaangażowanie mięśni pomocniczych.",sets:4,reps:"8-12",restTime:90,notes:"Napnij brzuch i pośladki. Prasa hantli lekko przed głowę, nie pionowo. Nie wyginaj lędźwi — to znak zbyt dużego ciężaru.",requiredEquipment:["dumbbells"]},{id:"shoulders-9",name:"Unoszenie hantli bokiem w opadzie (tylny bark)",muscleGroup:"Barki",difficulty:"Początkujący",description:"Opad tułowia przesuwa akcent na tylną głowę deltoidu. Tylny bark często zaniedbany i zbyt słaby relative do przedniego — ważny dla balansu i postawy.",sets:4,reps:"15-20",restTime:60,notes:"Tułów prawie równoległy do podłogi. Ręce prosto w dół, unoś bokiem. Małe ciężary, wysoka powtarzalność. Ściskaj tylny bark w górze.",requiredEquipment:["dumbbells"]},{id:"shoulders-10",name:"Odwrotne rozpiętki na maszynie (pec deck odwrotny)",muscleGroup:"Barki",difficulty:"Początkujący",description:"Maszyna odwrócona do rozpiętki izoluje tylny bark i romboidalne. Stałe napięcie wyciągu skuteczniejsze niż wolne ciężary dla tylnego deltoidu.",sets:3,reps:"15-20",restTime:45,notes:"Siedź tyłem do maszyny. Lekki ugięcie łokci. Rozchylaj ręce za linię barków. Ściskaj łopatki i tylny bark w punkcie szczytowym.",requiredEquipment:["cable_machine"]},{id:"shoulders-11",name:"Upright Row (wiosłowanie stojąc)",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Wiosłowanie sztangą lub hantlami ku brodzie angażuje środkowy bark i trapez. Kontrowersyjne dla zdrowia barku — najlepiej z szerokim chwytem.",sets:3,reps:"10-12",restTime:75,notes:"Szeroki chwyt (na szerokość barków) jest bezpieczniejszy dla barku niż wąski. Prowadź łokcie wysoko. Zatrzymaj gdy łokcie są na poziomie barków.",requiredEquipment:["barbell"]},{id:"shoulders-12",name:"Wznosy na wyciągu bocznym (cable lateral raise)",muscleGroup:"Barki",difficulty:"Początkujący",description:"Boczne unoszenie uchwytu wyciągu dolnym — w przeciwieństwie do hantli, wyciąg daje napięcie przez cały zakres ruchu, włącznie z dolną fazą.",sets:3,reps:"15-20",restTime:45,notes:"Stój bokiem do maszyny. Uchwyć uchwyt ręką po przeciwnej stronie. Unoś rękę w płaszczyźnie czołowej. Mały ciężar — to ćwiczenie izolowane.",requiredEquipment:["cable_machine"]},{id:"shoulders-13",name:"Press za głowę (behind neck press)",muscleGroup:"Barki",difficulty:"Zaawansowany",description:"Wyciskanie sztangi za głowę intensywnie angażuje środkowy i tylny bark. Wymaga dobrej mobilności barkowej — nie dla każdego.",sets:3,reps:"8-10",restTime:90,notes:"Tylko dla osób z dobrą mobilnością barku i bez historii kontuzji barkowych. Szeroki chwyt. Nie schodź poniżej uszu.",requiredEquipment:["barbell"]},{id:"biceps-7",name:"Uginanie EZ-bar (łamana sztanga)",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Łamana sztanga EZ-bar to bardziej naturalna pozycja nadgarstka niż prosta sztanga. Zmniejsza obciążenie stawów nadgarstkowych przy dużych ciężarach.",sets:3,reps:"8-10",restTime:75,notes:"Chwyt wewnętrzny (supinacja) lub pośredni — wypróbuj oba. Łokcie nieruchomo przy tułowiu. Nie używaj zamachu.",requiredEquipment:["barbell"]},{id:"biceps-8",name:"Uginanie Spiderman (na skosie twarzą w dół)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Leżenie na skośnej ławce twarzą w dół eliminuje możliwość bujania. Biceps pracuje w pełnym rozciągnięciu — wyjątkowy bodziec dla wzrostu.",sets:3,reps:"10-12",restTime:75,notes:"Klatka na ławce, ręce zwisają w dół. Uginaj w pełnym zakresie — nie skracaj ruchu. Powolna ekscentryka jest kluczowa.",requiredEquipment:["dumbbells","bench"]},{id:"biceps-9",name:"Uginanie koncentryczne (concentration curl)",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Klasyczne ćwiczenie na szczyt bicepsa wykonywane w siadzie. Łokieć oparty o udo eliminuje bujanie i maksymalizuje izolację.",sets:3,reps:"12-15 na rękę",restTime:60,notes:"Łokieć wewnętrznej strony oparty o wewnętrzną stronę uda. Pełna supinacja nadgarstka na górze. Powolna ekscentryka — co najmniej 2 sekundy.",requiredEquipment:["dumbbells"]},{id:"biceps-10",name:"Uginanie ze sztangą chwytem odwróconym (reverse curl)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Chwyt pronacyjny (dłonie ku ziemi) angażuje mocniej brachioradialis i brachialisem. Buduje objętość ramienia i siłę przedramion.",sets:3,reps:"10-12",restTime:60,notes:"Dużo mniejszy ciężar niż przy normalnym curl. Łokcie przy ciele. Pełen zakres ruchu mimo pronacji.",requiredEquipment:["barbell"]},{id:"biceps-11",name:"Uginanie cable z liną (drag curl)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Drag curl na wyciągu dolnym — prowadzenie łokci za ciało podczas uginania zmienia tor ruchu i maksymalizuje skurcz głowy długiej bicepsa.",sets:3,reps:"12-15",restTime:60,notes:'Cofaj łokcie za ciało podczas uginania — jakby "ciągnąc" sztangę wzdłuż brzucha ku górze. Poczujesz inną pracę niż przy zwykłym curl.',requiredEquipment:["cable_machine"]},{id:"triceps-8",name:"Pompki od krzesła (bench dips)",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Dips z nogami opartymi o podłogę lub drugie krzesło. Łatwa wersja dla początkujących lub jako rozgrzewka tricepsów.",sets:3,reps:"15-20",restTime:60,notes:"Ręce na krawędzi krzesła/ławki, palce do przodu. Tors blisko ławki. Im prostsze nogi, tym trudniej. Pełny zakres ruchu.",requiredEquipment:["bodyweight"]},{id:"triceps-9",name:"Prostowanie ramienia na wyciągu górnym (overhead cable)",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Prostowanie w pozycji nad głową maksymalizuje rozciągnięcie głowy długiej tricepsa. W połączeniu z pushdown tworzy kompletny trening tricepsa.",sets:3,reps:"12-15",restTime:60,notes:"Stań plecami do wyciągu. Chwyć linkę za głową. Prostuj ręce przed siebie, łokcie nieruchomo przy głowie. Poczuj rozciągnięcie tricepsa.",requiredEquipment:["cable_machine"]},{id:"triceps-10",name:"Kickback z hantlem w opadzie",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Prostowanie ramienia w tył w opadzie tułowia. Doskonałe ćwiczenie końcowe izolujące wszystkie głowy tricepsa przy pełnym wyproście.",sets:3,reps:"12-15 na rękę",restTime:60,notes:"Górna część ramienia równoległa do podłogi przez cały ruch. Prostuj tylko od łokcia — ramię nieruchome. Zaciśnij triceps na 1 sekundę w górze.",requiredEquipment:["dumbbells"]},{id:"triceps-11",name:"EZ-bar French press stojąc",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Stojące prostowanie ramion za głowę ze sztangą EZ. Angażuje głowę długą tricepsa w maksymalnym rozciągnięciu. Mniejsze obciążenie nadgarstków niż prosta sztanga.",sets:3,reps:"10-12",restTime:75,notes:"Łokcie wąsko, skierowane prosto w sufit przez cały ruch. Opuszczaj za głowę do pełnego rozciągnięcia. Core napięty — nie wyginaj pleców.",requiredEquipment:["barbell"]},{id:"triceps-12",name:"JM Press",muscleGroup:"Triceps",difficulty:"Zaawansowany",description:"Hybrydowe ćwiczenie łączące wyciskanie wąskim chwytem z French press. Stosowane przez powerlifterów do budowania tricepsów potrzebnych do wyciskania sztangi.",sets:3,reps:"8-10",restTime:90,notes:"Łokcie pod kątem 45° od tułowia. Opuszczaj gryf ku szyi jak French press, ale łokcie nie idą tak daleko do tyłu. Ciężar pośredni między bench a French press.",requiredEquipment:["barbell","bench"]},{id:"core-7",name:"Hollow Body Hold",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Podstawowe ćwiczenie gimnastyczne wzmacniające głęboki core. Fundament dla zaawansowanych ruchów kalistenicznych i sportowych.",sets:3,reps:"30-45 sek",restTime:60,notes:"Dolne plecy dociśnięte do podłogi przez cały czas. Ręce i nogi wyciągnięte, uniesione kilka cm od ziemi. Zacznij z ugiętymi nogami i idź ku wyprostowaniu.",requiredEquipment:["bodyweight"]},{id:"core-8",name:"Dead Bug",muscleGroup:"Brzuch",difficulty:"Początkujący",description:"Ćwiczenie anty-rotacyjne i anty-ekstensyjne idealne dla osób z bólami pleców. Uczy oddzielnego ruchu kończyn przy stabilnym torsie.",sets:3,reps:"10 na stronę",restTime:45,notes:"Leż na plecach, ręce w górę, nogi zgięte pod 90°. Jednocześnie opuść jedno ramię i przeciwną nogę ku podłodze. Plecy cały czas płasko na ziemi.",requiredEquipment:["bodyweight"]},{id:"core-9",name:"Pallof Press (anty-rotacja)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Ćwiczenie anty-rotacyjne na wyciągu. Opieranie się rotacji jest kluczowe dla sportowej siły i ochrony kręgosłupa w ruchach funkcjonalnych.",sets:3,reps:"10-12 na stronę",restTime:60,notes:"Stój bokiem do wyciągu. Trzymaj uchwyt przy klatce. Wypychaj na wprost — opieraj się rotacji. Im dalej od maszyny, tym trudniej.",requiredEquipment:["cable_machine"]},{id:"core-10",name:"Boczny plank (side plank)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Izometryczne ćwiczenie na skośne mięśnie brzucha i abduktory biodra. Kluczowe dla bocznej stabilności kręgosłupa i sylwetki talii.",sets:3,reps:"30-45 sek na stronę",restTime:45,notes:"Ciało w prostej linii od stopy do głowy. Biodra nie opadają. Zaawansowana wersja: z uniesieniem nogi lub z rotacją ramienia.",requiredEquipment:["bodyweight"]},{id:"core-11",name:"V-up (składanka)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Jednoczesne unoszenie nóg i tułowia angażuje zarówno górny jak i dolny brzuch oraz hip flexory. Bardziej intensywna alternatywa dla crunchów.",sets:3,reps:"15-20",restTime:45,notes:"Leż płasko, ręce nad głową. Unoś jednocześnie nogi i tułów — dotknij dłońmi palców stóp. Powolna ekscentryka przy opuszczaniu.",requiredEquipment:["bodyweight"]},{id:"core-12",name:"Dragon Flag",muscleGroup:"Brzuch",difficulty:"Zaawansowany",description:"Elitarne ćwiczenie na cały core — wynalezione i spopularyzowane przez Bruce Lee. Wymaga ogromnej siły brzucha i stabilizatorów.",sets:3,reps:"5-8",restTime:90,notes:"Zacznij od wersji ze zgiętymi kolanami. Trzymaj się ławki za głową. Całe ciało utrzymuj w linii — tylko łopatki mają kontakt z ławką.",requiredEquipment:["bench"]},{id:"core-13",name:"Plank z dotknięciem barku",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Plank z naprzemiennym dotykaniem przeciwnego barku. Ćwiczenie anty-rotacyjne wymagające stabilizacji core przy ruchu kończyn. Angażuje skośne, głęboki core i stabilizatory łopatki.",sets:3,reps:"20 (10 na stronę)",restTime:45,notes:"Pozycja górnej pompki. Stopy szerzej niż zwykle dla większej bazy stabilności. Dotknij lewą ręką prawego barku i odwrotnie. Biodra nie mogą się ruszać ani kołysać — to jest sedno ćwiczenia. Im wolniejsze tempo, tym większe wyzwanie.",requiredEquipment:["bodyweight"]},{id:"core-14",name:"Wiosłowanie hantlem z rotacją (renegade row)",muscleGroup:"Brzuch",difficulty:"Zaawansowany",description:"Kombinacja pompki i wiosłowania w pompce. Wyjątkowe obciążenie dla core anty-rotacyjnego i mięśni pleców jednocześnie.",sets:3,reps:"6-8 na rękę",restTime:90,notes:"Pozycja pompki z hantlami. Stopy szerzej. Wiośluj jedną ręką nie pozwalając biodrom na rotację. Core twardy jak skała przez cały czas.",requiredEquipment:["dumbbells"]},{id:"cardio-6",name:"Battle Ropes (liny bojowe)",muscleGroup:"Cardio",difficulty:"Średniozaawansowany",description:"Intensywny trening cardio angażujący ramiona, bark i core. Falowanie linami spala masywne ilości kalorii przy minimalnym obciążeniu stawów.",sets:5,reps:"30 sek",duration:15,restTime:30,notes:"Kolana ugięte, core napięty. Wypróbuj: fale naprzemienne, obustronne, kręgi. Wysoka intensywność przez krótki czas — maksymalny wysiłek w każdej rundzie.",requiredEquipment:["battle_ropes"]},{id:"cardio-7",name:"Trening na orbitreku (eliptycznym)",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Niskoudarowe cardio angażujące zarówno górne jak i dolne partie ciała. Idealne przy kontuzjach kolan lub stawów skokowych.",sets:1,reps:"",duration:35,restTime:0,notes:"Utrzymuj wyprostowaną postawę — nie pochylaj się na uchwytach. Włącz uchwytki ruchome dla zaangażowania ramion. Docelowe tętno: 65-75% max.",requiredEquipment:["elliptical"]},{id:"cardio-8",name:"Tabata (protokół)",muscleGroup:"Cardio",difficulty:"Zaawansowany",description:"Protokół: 20 sek maksymalnego wysiłku / 10 sek odpoczynku × 8 rund = 4 minuty. Naukowo udowodniona poprawa VO2max i spalanie tkanki tłuszczowej.",sets:8,reps:"20 sek praca / 10 sek odpoczynek",duration:4,restTime:10,notes:"Wybierz 1-4 ćwiczenia. Klasyczne: burpees, przysiady, pompki, mountain climbers. PEŁNY wysiłek podczas pracy — to klucz do efektywności Tabaty.",requiredEquipment:["bodyweight"]},{id:"cardio-9",name:"Mountain Climbers",muscleGroup:"Cardio",difficulty:"Średniozaawansowany",description:"Dynamiczne ćwiczenie cardio w pozycji deski. Angażuje core, barki i mięśnie nóg przy podwyższonym tętnie. Doskonałe jako finisher lub w obwodach.",sets:4,reps:"30 sek",duration:10,restTime:30,notes:"Pozycja pompki, biodra nisko. Naprzemiennie przyciągaj kolana ku klatce w szybkim tempie. Core napięty — nie pozwól biodrom kołysać się w górę.",requiredEquipment:["bodyweight"]},{id:"cardio-10",name:"Box Jump (skoki na skrzynię)",muscleGroup:"Cardio",difficulty:"Średniozaawansowany",description:"Pliometryczne ćwiczenie rozwijające eksplozywność nóg i moc. Treningowe narzędzie sportowców — angażuje szybkokurczliwe włókna mięśniowe.",sets:4,reps:"8-10",duration:0,restTime:90,notes:"Ląduj miękko, z ugiętymi kolanami — absorbuj siłę. Zeskakuj powoli (nie skacz). Zacznij od niskiej skrzyni (40-50 cm). Pełne wyproste bioder na górze.",requiredEquipment:["bodyweight"]},{id:"cardio-11",name:"Assault Bike (rower szturmowy)",muscleGroup:"Cardio",difficulty:"Zaawansowany",description:"Rower z obciążeniem zależnym od wysiłku — im mocniej pedałujesz, tym większy opór. Angażuje 100% mięśni ciała. Jeden z najtrudniejszych sprzętów cardio.",sets:1,reps:"",duration:20,restTime:0,notes:"10 min na 100 kalorii to cel dla zaawansowanych. Używaj techniki interwałowej: 10 sek sprint / 50 sek spokojnie. Trzymaj się uchwytu i angażuj ręce.",requiredEquipment:["stationary_bike"]},{id:"fullbody-7",name:"Thruster (przysiad + wyciskanie)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Połączenie frontal squat z wyciskaniem w jednym płynnym ruchu. Fundamentalne ćwiczenie CrossFit angażujące cały łańcuch kinetyczny.",sets:4,reps:"8-10",restTime:120,notes:"Pęd z przysiadu przenoś płynnie w wyciskanie. Hantla lub sztanga na barkach. Pełny przysiad + pełny wyprost ramion na górze. Oddech skoordynowany z ruchem.",requiredEquipment:["dumbbells"]},{id:"fullbody-8",name:"Farmer Walk (spacer farmera)",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Chód z ciężkimi hantlami angażuje chwyty, czworoboczny, core i mięśnie nóg. Funkcjonalne ćwiczenie siłowe o ogromnym transferze na codzienne życie.",sets:3,reps:"30-40 metrów",restTime:90,notes:"Duże obciążenie, możliwie maksymalne. Wyprostowana postawa — nie wychylaj się na boki. Krótkie, równe kroki. Ściskaj hantle jak najsilniej.",requiredEquipment:["dumbbells"]},{id:"fullbody-9",name:"Sandbag Carry (noszenie worka)",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Noszenie worka z piaskiem angażuje niestabilne obciążenie — wyjątkowy bodziec dla stabilizatorów, core i siły funkcjonalnej.",sets:3,reps:"20-30 metrów",restTime:90,notes:"Ściskaj worek mocno do klatki lub nieś na ramieniu. Każda pozycja inaczej angażuje mięśnie. Doskonałe do warunków domowych zamiast specjalistycznego sprzętu.",requiredEquipment:["bodyweight"]},{id:"fullbody-10",name:"Wall Ball (rzut piłką lekarską)",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Przysiad z wybuchem i rzutem piłki lekarskiej o ścianę. Łączy siłę nóg z siłą pchającą ramion i cardio w jednym dynamicznym ruchu.",sets:4,reps:"15-20",restTime:60,notes:"Złap piłkę miękko, tłumiąc uderzenie ugięciem kolan — przechodząc bezpośrednio w przysiad. Cel na ścianie ok. 3 m. Ciągłe tempo bez zatrzymań.",requiredEquipment:["bodyweight"]},{id:"fullbody-11",name:"Power Clean (zarzut siłowy)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Olimpijskie ćwiczenie balistyczne rozwijające eksplozywną siłę całego ciała. Stosowane przez sportowców wszystkich dyscyplin do poprawy mocy.",sets:5,reps:"3-5",restTime:180,notes:"Naucz się tego ćwiczenia z trenerem lub z bardzo lekkim ciężarem. Fazy: start z podłogi → eksplozja bioder → pociągnięcie → catch. Technika absolutnie priorytetowa.",requiredEquipment:["barbell"]},{id:"fullbody-12",name:"Kettlebell Clean & Press",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Zarzut kettlebella z wyciskaniem — pełnociałowy ruch łączący siłę biodra, ramion i core. Wyśmienite ćwiczenie kondycyjne i siłowe.",sets:4,reps:"6-8 na stronę",restTime:90,notes:"Clean: kettlebell po przedramieniu w pozycję rack. Press: wyciskaj nad głowę z napiętym core. Opuść kontrolowanie. Jedno ćwiczenie, pełne ciało.",requiredEquipment:["kettlebell"]},{id:"fullbody-13",name:"Sled Push (pchanie sań)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Pchanie obciążonych sań — intensywne ćwiczenie cardio-siłowe. Angażuje czworogłowe, pośladki, barki i tricepsy. Minimalne ryzyko kontuzji — ruch koncentryczny.",sets:5,reps:"20 metrów",restTime:120,notes:"Pochyl ciało do przodu ~45°. Krótkie szybkie kroki na przodostopiu. Ręce proste lub lekko ugięte. Ciśnij z bioder, nie z ramion.",requiredEquipment:["bodyweight"]},{id:"forearms-1",name:"Zginanie nadgarstków ze sztangą",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Izolowane ćwiczenie na zginacze przedramienia (flexor carpi radialis i ulnaris). Często pomijane, a kluczowe dla siły chwytu i wyglądu przedramion.",sets:3,reps:"15-20",restTime:45,notes:"Przedramiona oparte o ławkę lub uda — nadgarstek poza krawędzią. Dłonie skierowane ku górze. Pełen zakres — od maksymalnego wyprostu do maksymalnego zgięcia. Lekki ciężar, wysoka objętość. Powolna ekscentryka.",requiredEquipment:["barbell"]},{id:"forearms-2",name:"Prostowanie nadgarstków odwrócone",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Ćwiczenie na prostowniki przedramienia (extensor carpi) — mięśnie po tylnej stronie nadgarstka. Równoważą siłę z zginaniem i chronią łokieć przed przeciążeniem.",sets:3,reps:"15-20",restTime:45,notes:"Dłonie skierowane ku dołowi, przedramiona oparte na ławce. Bardzo mały ciężar — prostowniki są znacznie słabsze niż zginacze. Ważne dla prewencji łokcia tenisisty i golfisty. Wykonuj regularnie jeśli dużo używasz chwytu.",requiredEquipment:["barbell"]},{id:"forearms-3",name:"Ściskanie grippera (siła chwytu)",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Dynamiczne i izometryczne ćwiczenie siły chwytu. Bezpośredni wpływ na wyniki w martwym ciągu, podciąganiu i każdym ćwiczeniu wymagającym trzymania ciężaru.",sets:3,reps:"20-30",restTime:45,notes:"Ściskaj gripper do pełnego zaciśnięcia i powoli zwalniaj (2-3 sek). Możesz ćwiczyć w przerwach między innymi seriami. Progresuj przez wyższe opory grippera (50→100→150 kg). Alternatywa: ściskanie piłeczki tenisowej.",requiredEquipment:["bodyweight"]},{id:"chest-16",name:"Rozpiętki jednorącz na wyciągu górnym",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Jednostronne rozpiętki na wyciągu górnym — stałe napięcie przez cały zakres ruchu, większa izolacja niż z hantlami. Każda strona pracuje niezależnie, co eliminuje dysbalanse.",sets:3,reps:"12-15 na stronę",restTime:60,notes:"Stań bokiem lub przodem do maszyny. Uchwyć pojedynczy uchwyt ręką po zewnętrznej stronie. Prowadź rękę łukiem ku dołowi i do środka. Zaciśnij klatkę w dolnym punkcie przez 1 sek. Tułów lekko pochylony do przodu.",requiredEquipment:["cable_machine"],isUnilateral:!0},{id:"chest-17",name:"Rozpiętki jednorącz na wyciągu dolnym (górna klatka)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Jednostronne rozpiętki z wyciągu dolnego ku górze — celuje w górną część klatki piersiowej z pełnym napięciem. Świetna alternatywa dla skośnych rozpiętek z hantlami.",sets:3,reps:"12-15 na stronę",restTime:60,notes:"Stań bokiem do maszyny, uchwyć dolny pulley. Prowadź rękę łukiem od biodra ku górze i środkowi klatki. Lekkie ugięcie łokcia przez cały ruch. Czuj zacisk górnej klatki na szczycie.",requiredEquipment:["cable_machine"],isUnilateral:!0},{id:"chest-18",name:"Rozpiętki na wyciągu środkowym (cable fly)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Krzyżowanie linek na poziomie klatki — angażuje środkową i wewnętrzną część klatki piersiowej. Stałe napięcie wyciągu przez cały ruch jest bardziej efektywne niż hantle.",sets:3,reps:"12-15",restTime:60,notes:"Wyciągi na wysokości barków. Stań pośrodku, krok do przodu dla balansu. Prowadź ręce łukiem przed klatką — skrzyżuj je w końcowym punkcie dla maksymalnego zacisku. Powolna ekscentryka.",requiredEquipment:["cable_machine"]},{id:"chest-19",name:"Wyciskanie hantli na skos ujemny (dolna klatka)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Ławka pod kątem -15° do -30° z hantlami. Celuje w dolną część klatki piersiowej. Większy zakres ruchu niż ze sztangą i możliwość swobodniejszego ruchu każdego ramienia.",sets:3,reps:"10-12",restTime:90,notes:"Stopy zakotwiczone pod rolkami. Opuszczaj powoli, czuj rozciągnięcie dolnej klatki. Zaciśnij mocno na górze. Nie stosuj gdy masz problemy z ciśnieniem krwi.",requiredEquipment:["dumbbells","bench"]},{id:"chest-20",name:"Pompki diamentowe (diamond push-ups)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Pompki z dłońmi ułożonymi w kształt rombu pod klatką. Intensywnie angażują wewnętrzną część klatki piersiowej i tricepsy — bez żadnego sprzętu.",sets:3,reps:"10-15",restTime:60,notes:"Kciuki i palce wskazujące tworzą romb. Łokcie blisko ciała przy opuszczaniu. Czuj napięcie wewnętrznej klatki. Modyfikacja: na kolanach dla mniejszej intensywności.",requiredEquipment:["bodyweight"]},{id:"chest-21",name:"Pompki szerokimi rękoma (wide push-ups)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Pompki z szerokim ustawieniem dłoni — maksymalne zaangażowanie zewnętrznej i środkowej klatki piersiowej. Przenosi ciężar z tricepsów na klatkę.",sets:3,reps:"15-20",restTime:60,notes:"Ręce znacznie szerzej niż barki. Łokcie rozchylone na zewnątrz przy zejściu. Klatka dotyka podłogi. Ciało w linii przez cały czas.",requiredEquipment:["bodyweight"]},{id:"chest-22",name:"Wyciskanie sztangi leżąc — dolna klatka (decline bench)",muscleGroup:"Klatka piersiowa",difficulty:"Średniozaawansowany",description:"Wyciskanie na ławce ze skosem ujemnym ze sztangą. Angażuje dolną część klatki (sternocostal head). Pozwala na większy ciężar niż pozycja płaska.",sets:4,reps:"8-10",restTime:120,notes:"Stopy zakotwiczone pod rolkami. Łopatki ściągnięte i dociśnięte. Gryf opuszczaj na dolną część klatki. Powolna ekscentryka 2-3 sek.",requiredEquipment:["barbell","bench"]},{id:"core-15",name:"Allahy (skłony na kolanach z linką wyciągu)",muscleGroup:"Brzuch",difficulty:"Początkujący",description:'Klasyczne "allahy" — skłony tułowia na kolanach z linką wyciągu górnego. Jedno z najskuteczniejszych ćwiczeń izolujących mięsień prosty brzucha, szczególnie górną jego część. Stałe napięcie wyciągu przez cały ruch to ogromna przewaga nad klasycznym crunchem.',sets:3,reps:"15-20",restTime:45,notes:'Uklęknij przed wyciągiem górnym, chwyć linkę (lub uchwyty) przy głowie lub za uszami. Zginaj tułów w dół — jakbyś chciał dotknąć łokciami kolan — siłą brzucha, NIE ciągnąc ramionami. Biodra nieruchome przez cały czas. Ruch odbywa się wyłącznie w kręgosłupie piersiowym i lędźwiowym. Powrót powolny i kontrolowany — to "negatyw" też buduje mięsień.',requiredEquipment:["cable_machine"]},{id:"core-16",name:"Allahy z rotacją (skłony skośne na wyciągu)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Wariant allahów z rotacją tułowia — skłon w kierunku przeciwnego kolana angażuje mięśnie skośne brzucha. Doskonałe uzupełnienie klasycznych allahów dla pełnego rozwoju brzucha.",sets:3,reps:"12-15",restTime:45,notes:"Pozycja identyczna jak w klasycznych allahach. W fazie skłonu kieruj prawy łokieć ku lewemu kolanu i odwrotnie. Biodra przez cały czas nieruchome — ruch rotacyjny pochodzi wyłącznie z tułowia. Wykonuj na przemian po jednej stronie lub w seriach jednostronnych. Zachowaj wolne tempo.",requiredEquipment:["cable_machine"]},{id:"core-17",name:"Unoszenie kolan w zwisie (knee raise)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Łatwiejsza wersja unoszenia prostych nóg w zwisie — ugięte kolana redukują dźwignię. Doskonałe ćwiczenie przejściowe dla dolnego brzucha.",sets:3,reps:"12-15",restTime:60,notes:"Zwis na drążku, uchwyć mocno. Przyciągaj kolana do klatki ruchem bioder — nie tylko zginaj nogi. Zaciśnij brzuch na górze przez 1 sek. Powolna ekscentryka.",requiredEquipment:["pull_up_bar"]},{id:"core-18",name:"Crunch klasyczny",muscleGroup:"Brzuch",difficulty:"Początkujący",description:"Podstawowe ćwiczenie na górną część prostownika brzucha. Krótki zakres ruchu skupiony na skurczu — nie unoszenie całego tułowia.",sets:3,reps:"20-25",restTime:45,notes:"Leż na plecach, nogi ugięte. Unoś górną część tułowia — nie szyję! Ręce przy skroniach, łokcie na zewnątrz. Zaciśnij brzuch w górnym punkcie. Dolne plecy zawsze na macie.",requiredEquipment:["bodyweight"]},{id:"core-19",name:"Crunch skośny (skręty tułowia)",muscleGroup:"Brzuch",difficulty:"Początkujący",description:"Crunch z rotacją tułowia angażujący skośne mięśnie brzucha (obliques). Ważne dla sylwetki talii i siły rotacyjnej.",sets:3,reps:"20 (10 na stronę)",restTime:45,notes:"Przy uniesieniu tułowia obróć go — lewy łokieć do prawego kolana. Ruch pochodzi z brzucha, nie od szarpnięcia szyi. Wymiana płynna.",requiredEquipment:["bodyweight"]},{id:"core-20",name:"Rowerek (bicycle crunch)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Badania EMG wskazują na rower jako jedno z najefektywniejszych ćwiczeń na brzuch — angażuje prostownik i skośne jednocześnie z obciążeniem kończyn.",sets:3,reps:"30 sek",restTime:45,notes:"Lewy łokieć do prawego kolana i odwrotnie — naprzemiennie. Nogi nie dotykają podłogi. Tempo umiarkowane — czuj każde powtórzenie. Dolne plecy dociśnięte do maty.",requiredEquipment:["bodyweight"]},{id:"core-21",name:"Leg Raise leżąc (unoszenie prostych nóg)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Unoszenie prostych nóg z pozycji leżącej na plecach. Angażuje dolny brzuch i hip flexory — uzupełnienie ćwiczeń górnego brzucha.",sets:3,reps:"12-15",restTime:45,notes:"Leż na plecach, dłonie pod pośladkami dla wsparcia. Unoś proste nogi do 90°. Opuszczaj powoli — nie dotykaj podłogi. Dolne plecy dociśnięte przez cały czas.",requiredEquipment:["bodyweight"]},{id:"core-22",name:"Windshield Wipers (wycieraczki)",muscleGroup:"Brzuch",difficulty:"Zaawansowany",description:"Rotacyjne ćwiczenie na skośne mięśnie brzucha w zwisie lub leżeniu. Ogromne obciążenie dla lateral core przy zachowaniu stabilności bioder.",sets:3,reps:"8-10 na stronę",restTime:75,notes:"Wersja leżąca: nogi w górze, opuszczaj je na boki nie dotykając podłogi. Wersja w zwisie: trzymaj się drążka, obracaj nogi poziomo. Ruch z brzucha, nie z bioder.",requiredEquipment:["pull_up_bar"]},{id:"core-23",name:"Żuraw (toe touch crunch)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Leżąc na plecach z nogami pionowo — dotykaj palców stóp unosząc tułów. Angażuje cały brzuch z naciskiem na górną część prostownika.",sets:3,reps:"15-20",restTime:45,notes:"Nogi pionowo w górze. Unoś tułów i sięgaj dłońmi ku stopom. Zaciśnij brzuch na szczycie. Powolna ekscentryka — nie padaj z powrotem.",requiredEquipment:["bodyweight"]},{id:"core-24",name:"Plank na przedramionach z rotacją",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Klasyczny plank wzbogacony o rotację tułowia — angażuje skośne, głęboki core i stabilizatory. Bardziej dynamiczne i trudniejsze niż statyczny plank.",sets:3,reps:"10 na stronę",restTime:45,notes:"Z pozycji planku na przedramionach obróć ciało na bok podpierając się jednym przedramieniem. Drugie ramię wyciągnij ku sufitowi. Wróć i zmień stronę.",requiredEquipment:["bodyweight"]},{id:"core-25",name:"Crunch na wyciągu z liną stojąc",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Wariant cable crunch w pozycji stojącej — zmienia kąt pracy brzucha i angażuje stabilizatory. Progresja obciążenia jak w tradycyjnym cable crunch.",sets:3,reps:"15-20",restTime:45,notes:"Stój tyłem do wyciągu górnego z liną za głową. Zginaj tułów ku dołowi siłą brzucha — nie ciągnij ramionami. Zatrzymaj się gdy tors jest równoległy do podłogi.",requiredEquipment:["cable_machine"]},{id:"back-19",name:"Ściąganie jednorącz na wyciągu górnym",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Jednostronne ściąganie na wyciągu górnym — każda strona pracuje niezależnie. Eliminuje kompensację silniejszej strony i pozwala na głębszy zakres ruchu.",sets:3,reps:"12-15 na stronę",restTime:60,notes:"Uchwyć pojedynczy uchwyt. Ściągaj łokieć w dół i do tyłu — ku biodru. Lekka rotacja tułowia jest naturalna. Zaciśnij najszerszy w dolnym punkcie.",requiredEquipment:["cable_machine"],isUnilateral:!0},{id:"back-20",name:"Wiosłowanie jednorącz na wyciągu dolnym",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Jednostronne wiosłowanie na wyciągu dolnym daje stałe napięcie przez cały zakres. Lepsze dla izolacji niż hantel przy tych samych ciężarach.",sets:3,reps:"12-15 na stronę",restTime:60,notes:"Stój bokiem lub przodem do maszyny. Ściągaj łokieć za biodro. Ściśnij łopatkę w końcowym punkcie. Nie kręcaj torsem — tylko ramię pracuje.",requiredEquipment:["cable_machine"],isUnilateral:!0},{id:"back-21",name:"Podciąganie chwytem podchwytem (chin-up)",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Podchwyt (dłonie do siebie) mocniej angażuje biceps, co pozwala podciągnąć się łatwiej i z większą masą. Doskonałe ćwiczenie na biceps i plecy jednocześnie.",sets:4,reps:"6-10",restTime:90,notes:"Chwyt wąski, dłonie do siebie. Inicjuj ruch łopatkami — wciągaj je zanim zaczniesz uginać ramiona. Klatka do drążka, pełny zakres ruchu.",requiredEquipment:["pull_up_bar"]},{id:"back-22",name:"Wiosłowanie z gumą stojąc (face pull z gumą)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Domowy odpowiednik face pull na wyciągu. Wzmacnia tylny bark, romboidalne i zewnętrzne rotatory — kluczowe dla zdrowia stawu barkowego.",sets:3,reps:"15-20",restTime:45,notes:"Przyczep gumę do stabilnego punktu na wysokości twarzy. Ściągaj do twarzy rozdzielając ręce ku uszom. Łokcie wysoko. Ściskaj łopatki i tylny bark.",requiredEquipment:["resistance_bands"]},{id:"back-23",name:"Pullover z hantlem leżąc",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Klasyczne ćwiczenie angażujące mięsień najszerszy, klatę i długą głowę tricepsa. Unikalny ruch w sagitalnej płaszczyźnie który nie ma dobrego substytutu.",sets:3,reps:"12-15",restTime:75,notes:"Leż poprzecznie na ławce — tylko górna część pleców oparta. Hantel oburącz nad klatką. Opuszczaj za głowę z ugiętymi łokciami. Czuj rozciągnięcie najszerszego. Wróć siłą pleców.",requiredEquipment:["dumbbells","bench"]},{id:"back-24",name:"Wiosłowanie szerokim chwytem (wide grip row)",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Wiosłowanie ze sztangą szerokim chwytem — zmienia kąt pracy i przenosi nacisk na tylne barki i górne trapeze. Uzupełnienie standardowego wiosłowania.",sets:3,reps:"10-12",restTime:90,notes:"Chwyt szerszy niż barki, dłonie pronacyjnie. Ściągaj gryf do dolnej klatki/nadbrzusza. Łokcie rozchylone na zewnątrz. Ściskaj łopatki mocno w końcowym punkcie.",requiredEquipment:["barbell"]},{id:"legs-23",name:"Hack squat na maszynie",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Przysiad na maszynie hack squat — pionowy tors i pełny zakres ruchu przy minimalnym obciążeniu kręgosłupa. Doskonała izolacja czworogłowych i pośladków. Bezpieczna alternatywa dla przysiadu ze sztangą.",sets:4,reps:"10-12",restTime:90,notes:"Stopy na środku platformy lub wyżej dla większego zaangażowania pośladków. Kolana aktywnie na zewnątrz przez cały ruch. Nie blokuj kolan w górze. Zejdź do pełnej głębokości — im głębiej, tym lepiej dla pośladków. Powolna ekscentryka 2-3 sek.",requiredEquipment:["leg_press","smith_machine"]},{id:"legs-24",name:"Przysiad z hantlami (dumbbell squat)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Klasyczny przysiad z hantlami trzymanymi w dłoniach. Łatwiejszy technicznie niż ze sztangą — dobry wstęp do wzorca ruchowego przysiadu.",sets:3,reps:"12-15",restTime:75,notes:"Hantle przy bokach ciała lub na barkach. Stopy na szerokość barków, palce lekko rozchylone. Kolana nad palcami. Klatka prosto. Minimum do równoległości.",requiredEquipment:["dumbbells"]},{id:"legs-25",name:"Uginanie nóg siedząc (seated leg curl)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Wersja siedząca leg curl — soleus i gastrocnemius pracują w innym zakresie niż przy leżeniu. Niektóre badania wskazują na większą aktywację dwugłowych niż w wersji leżącej.",sets:3,reps:"12-15",restTime:60,notes:"Reguluj maszyn tak by oś obrotu była przy stawie kolanowym. Pełen zakres ruchu. Powolna ekscentryka (3 sek). Nie zrywaj na górze.",requiredEquipment:["leg_curl_machine"]},{id:"legs-26",name:"Wykroki z kettlebellem",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Wykroki z kettlebellem trzymanym w rack position lub w opuszczonych rękach. Dodatkowe wymagania dla stabilizacji core i barków.",sets:3,reps:"10 na nogę",restTime:75,notes:"Kettlebell w rack position (przy barku) bardziej angażuje core. Długi krok, kolano tylne prawie dotyka podłogi. Wróć siłą nogi przedniej.",requiredEquipment:["kettlebell"],isUnilateral:!0},{id:"legs-27",name:"Przysiad boczny z gumą (lateral band walk)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Chód boczny z gumą oporową nad kolanami aktywuje pośladkowy średni — kluczowy mięsień stabilizujący kolano i biodro. Prewencja kontuzji kolan.",sets:3,reps:"15 kroków na stronę",restTime:45,notes:"Guma powyżej lub poniżej kolan. Lekki przysiad przez cały czas. Kroki boczne — nie przyciągaj stóp. Kolana nie zawijają do środka.",requiredEquipment:["resistance_bands"]},{id:"legs-28",name:"Hip Thrust z gumą oporową",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Hip thrust z gumą zamiast sztangi — ideal dla domowego treningu lub jako rozgrzewka przed ciężkim hip thrustem. Aktywuje pośladki i pośladkowy średni jednocześnie.",sets:3,reps:"15-20",restTime:60,notes:"Guma ponad kolanami. Łopatki oparte o ławkę lub kanapę. Pchaj biodra ku górze, jednocześnie odpychaj kolana od gumy. Ściśnij pośladki mocno na górze.",requiredEquipment:["resistance_bands","bench"]},{id:"legs-29",name:"Żuraw jednonóż (single leg deadlift)",muscleGroup:"Nogi",difficulty:"Zaawansowany",description:"Martwy ciąg na jednej nodze — ogromne wymagania dla stabilizacji bioder i propriocepcji. Angażuje pośladki, dwugłowe uda i stabilizatory stawu skokowego.",sets:3,reps:"8-10 na stronę",restTime:90,notes:"Stój na jednej nodze, hantel w przeciwnej ręce. Opadaj do przodu utrzymując plecy neutralnie — tylna noga unosi się jak balast. Zaciśnij pośladek stojącej nogi na górze.",requiredEquipment:["dumbbells"],isUnilateral:!0},{id:"legs-30",name:"Przysiad na jednej nodze (pistol squat)",muscleGroup:"Nogi",difficulty:"Zaawansowany",description:"Przysiad na jednej nodze — szczyt ćwiczeń z masą ciała na nogi. Wymaga siły, mobilności i balansu. Jeden z najtrudniejszych ruchów kalistenicznych.",sets:3,reps:"5-8 na nogę",restTime:90,notes:"Zacznij od wersji na podwyższeniu lub z trzymaniem się. Wolna noga wyciągnięta przed siebie. Klatka prosto. Kolano nad palcami. Progresuj przez wersje wspomagane.",requiredEquipment:["bodyweight"]},{id:"shoulders-14",name:"Wznosy hantli 3 drogi (front/lateral/rear)",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Kompletna superset na wszystkie trzy głowy deltoidu: unoszenie przodem, bokiem i w opadzie. Oszczędza czas i zapewnia wszechstronne pobudzenie barku.",sets:3,reps:"10 każde",restTime:90,notes:"Bez przerwy między ruchami w obrębie jednej serii. Lekki ciężar — cel to pełne wyczerpanie barku. Przód → bok → tył, bez odkładania hantlami.",requiredEquipment:["dumbbells"]},{id:"shoulders-15",name:"Wyciskanie na wyciągu (cable shoulder press)",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Wyciskanie nad głowę na wyciągu dolnym — stałe napięcie przez cały zakres, inne od hantlami czy sztangą. Dobra alternatywa gdy bolą stawy.",sets:3,reps:"10-12",restTime:75,notes:"Uchwyć oba dolne pulley. Stań pośrodku w
