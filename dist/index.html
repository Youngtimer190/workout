ment:["resistance_bands"]},{id:"shoulders-17",name:"Press z hantlami stojąc (push press)",muscleGroup:"Barki",difficulty:"Zaawansowany",description:"Wyciskanie z lekkim podskokiem bioder — pozwala na większy ciężar niż strict press i uczy transferu siły z dolnej do górnej partii ciała.",sets:4,reps:"6-8",restTime:120,notes:"Lekkie ugięcie kolan i wybuch z bioder startuje ruch. Ramiona kończą wyciskanie. Ciężar wraca do barków z kontrolą — nie łap z góry. Idealne do przeciążeń supramaksymalnych.",requiredEquipment:["dumbbells"]},{id:"biceps-12",name:"Uginanie ramion na wyciągu górnym (overhead curl)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Unikalny kąt pracy bicepsa — ramię uniesione, biceps pracuje w długiej i środkowej pozycji. Wyjątkowy bodziec dla głowy krótkiej bicepsa.",sets:3,reps:"12-15",restTime:60,notes:"Ustaw wyciąg na poziomie ramienia lub wyżej. Ramię poziomo, uginaj ku głowie. Stałe napięcie przez cały ruch. Rzadko stosowane — unikalny bodziec dla bicepsa.",requiredEquipment:["cable_machine"]},{id:"biceps-13",name:"Wiosłowanie podchwytem (supinated row)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Wiosłowanie z podchwytem supinacyjnym mocno angażuje biceps jako mięsień pomocniczy. Łączy ćwiczenie pleców z pracą bicepsa.",sets:3,reps:"10-12",restTime:90,notes:"Chwyt podchwytem na szerokość barków. Ściągaj gryf do pępka. Biceps pomaga latissimus w ściąganiu — duże obciążenie na obie partie. Tors 45°.",requiredEquipment:["barbell"]},{id:"biceps-14",name:"Uginanie z hantlami na skosie (incline dumbbell curl)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Leżenie na skośnej ławce (45-60°) rozciąga biceps na starcie co daje unikalny bodziec dla głowy długiej. Eliminuje bujanie i izoluje biceps.",sets:3,reps:"10-12",restTime:75,notes:"Oprzyj się o ławkę pod skosem ~45°. Ręce zwisają swobodnie w dół. Uginaj powoli. Rozciągnięcie na dole ruchu jest kluczowe — nie skracaj zakresu.",requiredEquipment:["dumbbells","bench"]},{id:"triceps-13",name:"Prostowanie ramion z liną (rope pushdown)",muscleGroup:"Triceps",difficulty:"Początkujący",description:"Pushdown z liną pozwala na rotację nadgarstków w dolnym punkcie — większy zacisk zewnętrznej głowy tricepsa. Jeden z najpopularniejszych wariantów pushdown.",sets:3,reps:"12-15",restTime:60,notes:"W dolnym punkcie rozdziel końce liny na zewnątrz — zmaksymalizuj zacisk bocznych głów tricepsa. Łokcie nieruchomo przy ciele. Pełen wyprost w dole.",requiredEquipment:["cable_machine"]},{id:"triceps-14",name:"Wyciskanie Tate Press (pająk)",muscleGroup:"Triceps",difficulty:"Zaawansowany",description:"Ekscentryczne ćwiczenie tricepsa gdzie łokcie opadają na zewnątrz zamiast ku głowie. Popularne wśród powerlifterów do wzmacniania lockoutu.",sets:3,reps:"10-12",restTime:75,notes:"Leż na ławce z hantlami nad klatką. Opuść je do klatki zginając łokcie na zewnątrz (nie za głowę). Wróć prostując tricepsy. Unikalny kąt — wypróbuj lekki ciężar na start.",requiredEquipment:["dumbbells","bench"]},{id:"triceps-15",name:"Prostowanie ramion za głowę z liną (overhead rope)",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Overhead tricep extension z liną na wyciągu — stałe napięcie przez cały zakres z naciskiem na rozciągniętą pozycję głowy długiej tricepsa.",sets:3,reps:"12-15",restTime:60,notes:"Stój tyłem do wyciągu z liną nad głową. Trzymaj końce liny za głową. Wyprostuj ramiona przed siebie. Łokcie nieruchomo. Powoli wróć do rozciągnięcia.",requiredEquipment:["cable_machine"]},{id:"cardio-12",name:"Sprint interwałowy na boisku",muscleGroup:"Cardio",difficulty:"Zaawansowany",description:"Klasyczne sprinty 100m lub krócej z odpoczynkiem aktywnym. Rozwijają maksymalną prędkość, moc eksplozywną i układ sercowo-naczyniowy.",sets:6,reps:"30 metrów",duration:20,restTime:90,notes:"Rozgrzewka 10 min obowiązkowa przed sprintami. Maksymalny wysiłek przez cały sprint. Odpoczynek aktywny — marsz z powrotem. Zacznij od 4-6 powtórzeń.",requiredEquipment:["bodyweight"]},{id:"cardio-13",name:"Trucht regeneracyjny (jogging)",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Wolny bieg w tempie regeneracyjnym (60-65% max tętna). Idealne w dni między treningami siłowymi dla aktywnej regeneracji i podstawy aerobowej.",sets:1,reps:"",duration:30,restTime:0,notes:"Tempo przy którym możesz śpiewać piosenkę. Podbicia ląduj na środkostopiu. Użyj jako aktywna regeneracja — nie zastępuj nim wypoczynku gdy jesteś naprawdę zmęczony.",requiredEquipment:["bodyweight"]},{id:"cardio-14",name:"Stepping w miejscu z kolanami",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Marching w miejscu z wysokim unoszeniem kolan. Idealne cardio domowe bez sprzętu — angażuje nogi i podwyższa tętno bez uderzenia stawów.",sets:3,reps:"1 min",duration:15,restTime:30,notes:"Kolano minimum do poziomu bioder. Maszeruj energicznie machając ramionami. Możesz dodać boczne ruchy dla większej intensywności.",requiredEquipment:["bodyweight"]},{id:"fullbody-14",name:"Man Maker",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Złożona kombinacja: pompka + wiosłowanie oburącz + clean + przysiad + press — wszystko w jednym. Jedno z najtrudniejszych ćwiczeń kondycyjnych z hantlami.",sets:3,reps:"5-8",restTime:120,notes:"Sekwencja: pompka → wiosłowanie prawą → wiosłowanie lewą → squat clean → press. Lekkie hantle — technika i kondycja są kluczowe. Idealne jako finisher.",requiredEquipment:["dumbbells"]},{id:"fullbody-15",name:"Devil Press",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Burpee z hantlami zakończony wyciskaniem nad głowę. Ekstremalnie kondycyjne ćwiczenie popularne w CrossFit i fitness wyzwaniach.",sets:4,reps:"8-10",restTime:90,notes:"Zacznij z hantlami na podłodze. Zrób burpee (pompka opcjonalna) → chwyć hantle → clean → wyciskanie nad głowę. Lekkie hantle — tu liczy się tempo.",requiredEquipment:["dumbbells"]},{id:"fullbody-16",name:"Zarzut sztangi (barbell clean)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Klasyczny ruch olimpijski — zarzut sztangi z podłogi do barku. Rozwija eksplozywność bioder, siłę chwytów i koordynację całego ciała.",sets:5,reps:"3",restTime:180,notes:"Ucz się tego ruchu tylko pod okiem trenera lub z bardzo lekkim ciężarem. Kluczowe fazy: pierwsze zerwanie → eksplozja bioder → pociągnięcie → catch. Technika ponad ciężar.",requiredEquipment:["barbell"]},{id:"fullbody-17",name:"Narciarz na wyciągu (cable ski)",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Ćwiczenie na wyciągu dolnym naśladujące ruch narciarza. Angażuje pośladki, dwugłowe uda, plecy (najszerszy i romboidalne), tricepsy i mięśnie stabilizujące core — wszystko w jednym dynamicznym, wielostawowym ruchu. Utrzymuje stałe napięcie mięśniowe przez cały zakres dzięki prowadnicy wyciągu.",sets:3,reps:"12-15",restTime:60,notes:"Stań przodem do wyciągu dolnego, chwyć linkę oburącz. Wyjdź kilka kroków do tyłu, stopy na szerokość bioder. Wykonaj przysiad (biodra cofnięte), a następnie eksplozywnie wstań i wypchnij ręce do tyłu-góry wzdłuż boków ciała — jak przy zakończeniu pchania kijkami narciarskimi. Kontroluj powrót do pozycji wyjściowej. Ruch inicjuj biodrami, nie ramionami. Utrzymuj kręgosłup neutralny przez cały czas.",requiredEquipment:["cable_machine"]},{id:"legs-31",name:"Glute Bridge (mostek biodrowy)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Podstawowe ćwiczenie na pośladki i dwugłowe uda z masą ciała. Łatwiejsza i bezpieczniejsza alternatywa dla hip thrust — idealna dla początkujących i do nauki aktywacji pośladków.",sets:3,reps:"15-20",restTime:45,notes:"Leżenie na plecach, kolana ugięte, stopy płasko na podłodze. Unieś biodra aż tułów i uda tworzą prostą linię. Ściśnij mocno pośladki na górze i przytrzymaj 1 sekundę. Nie przeprostowuj lędźwi.",requiredEquipment:["bodyweight"]},{id:"legs-32",name:"Glute Bridge z obciążeniem",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Wersja mostku biodrowego z hantlem lub talerzem na biodrach. Pozwala na progresję obciążenia przy izolacji pośladków — dobry krok między glute bridge a hip thrust ze sztangą.",sets:4,reps:"12-15",restTime:60,notes:"Połóż hantlę lub talerz na biodrach, trzymaj go rękami. Stopy nieco szerzej niż przy zwykłym mostku. Pełne ściśnięcie pośladków na górze przez 2 sekundy.",requiredEquipment:["dumbbells"]},{id:"legs-33",name:"Wypady w tył (reverse lunge)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Bezpieczniejsza alternatywa dla wykroków do przodu — cofając nogę zmniejszasz obciążenie kolana przedniego. Angażuje czworogłowe, pośladki i stabilizatory. Świetne dla osób z problemami kolan.",sets:3,reps:"10-12 na nogę",restTime:60,notes:"Stań prosto, zrób krok do tyłu i opuść tylne kolano prawie do podłogi. Kolano przedniej nogi nie przekracza linii palców. Wróć do pozycji wyjściowej odpychając się przednią stopą.",requiredEquipment:["bodyweight"]},{id:"legs-34",name:"Wypady w tył z hantlami",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Wypady w tył z hantlami w dłoniach. Dodatkowe obciążenie zwiększa zaangażowanie mięśni i wymaga lepszej stabilizacji tułowia.",sets:3,reps:"10-12 na nogę",restTime:75,notes:"Hantle trzymaj wzdłuż ciała. Kontroluj ruch — nie rzucaj kolanem do przodu. Możesz też trzymać jedną hantlę przy klatce (goblet position) dla łatwiejszego balansowania.",requiredEquipment:["dumbbells"]},{id:"legs-35",name:"Przysiad z wyskokiem (jump squat)",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Pliometryczne ćwiczenie łączące przysiad z eksplozywnym wyskokiem. Trenuje moc, siłę i wytrzymałość mięśniową nóg jednocześnie. Podnosi tętno i spala więcej kalorii niż klasyczny przysiad.",sets:4,reps:"10-12",restTime:60,notes:"Zejdź do przysiadu (uda równolegle do podłogi), a następnie eksplozywnie wyskocz jak najwyżej. Ląduj miękko na przodostopiu z ugiętymi kolanami — amortyzuj lądowanie. Nie blokuj kolan.",requiredEquipment:["bodyweight"]},{id:"legs-36",name:"Wspięcia na palce z hantlami stojąc",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Izolowane ćwiczenie na łydki z hantlami. Prosta alternatywa gdy nie ma maszyny — hantle dodają obciążenie i umożliwiają progresję.",sets:4,reps:"15-20",restTime:45,notes:"Stój na krawędzi stopnia lub płasko. Hantle trzymaj wzdłuż ciała. Unieś się na palcach jak najwyżej, zatrzymaj 1 sek na górze, powoli opuść. Pełen zakres — piętą poniżej poziomu palców jeśli stoisz na stopniu.",requiredEquipment:["dumbbells"]},{id:"legs-37",name:"Nożyce (scissors lunge)",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Dynamiczne ćwiczenie pliometryczne — zmiana nóg w powietrzu z pozycji wykroku. Angażuje czworogłowe, pośladki, łydki i układ krążenia. Doskonałe jako finisher lub do treningu interwałowego.",sets:3,reps:"10 na nogę",restTime:60,notes:"Zacznij w pozycji wykroku. Eksplozywnie wyskocz i zmień nogi w powietrzu, lądując w wykroku na drugą nogę. Ląduj miękko z ugiętymi kolanami. Utrzymuj tułów wyprostowany przez cały ruch.",requiredEquipment:["bodyweight"]},{id:"legs-38",name:"Calf raise na prasie do nóg",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Wspięcia na palce wykonywane na maszynie leg press. Pozwala na użycie większego obciążenia niż stojąc, przy pełnym zakresie ruchu. Doskonała izolacja obu głów łydki.",sets:4,reps:"15-20",restTime:45,notes:"Połóż tylko przodostopie na dolnej krawędzi platformy — pięty swobodnie zwisają. Wyprostuj kolana (nie blokuj). Unoś i opuszczaj piętę w pełnym zakresie. Powolna ekscentryka 2-3 sek.",requiredEquipment:["leg_press"]},{id:"legs-39",name:"Frog pump (żaba)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Ćwiczenie aktywacyjne na pośladki w pozycji leżącej ze stopami złączonymi podeszwami. Świetna aktywacja przed treningiem lub jako ćwiczenie uzupełniające dla osób z trudnością czucia pośladków.",sets:3,reps:"20-25",restTime:30,notes:"Leżenie na plecach, podeszwy stóp złączone, kolana rozchylone. Unieś biodra ściskając pośladki. Krótki zakres ruchu — skup się na czuciu mięśnia, nie na wysokości uniesienia.",requiredEquipment:["bodyweight"]},{id:"legs-40",name:"Romanian split squat z hantlami",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Odmiana przysiadu bułgarskiego z naciskiem na rozciągnięcie dwugłowych uda i pośladków. Tylna noga wyżej, biodra bardziej cofnięte — celuje w tylny łańcuch kinetyczny.",sets:3,reps:"10-12 na nogę",restTime:75,notes:"Tylna stopa na ławce, przednia noga daleko przed ciałem. Opuszczaj tułów pochylając go do przodu (hip hinge) — czuj rozciągnięcie dwugłowych. Hantle trzymaj wzdłuż ciała.",requiredEquipment:["dumbbells","bench"]},{id:"shoulders-18",name:"Cuban Press z hantlami",muscleGroup:"Barki",difficulty:"Początkujący",description:"Ćwiczenie profilaktyczne łączące rotację zewnętrzną barku z wyciskaniem. Wzmacnia rotatory mankietu, tylny bark i czworoboczny. Kluczowe dla zdrowia stawu barkowego przy intensywnym treningu.",sets:3,reps:"12-15",restTime:45,notes:"Faza 1: unieś łokcie do poziomu barków (upright row). Faza 2: obróć przedramiona ku górze (rotacja zewnętrzna). Faza 3: wyciśnij nad głowę. Używaj lekkiego ciężaru — to ćwiczenie rehabilitacyjne.",requiredEquipment:["dumbbells"]},{id:"shoulders-19",name:"Ćwiczenie YTW z hantlami",muscleGroup:"Barki",difficulty:"Początkujący",description:"Trzyfazowe ćwiczenie profilaktyczne na tylny bark, środkowy i dolny czworoboczny. Niezbędne dla każdego kto dużo wyciska — stabilizuje łopatkę i zapobiega kontuzjom.",sets:3,reps:"10-12 każda litera",restTime:45,notes:"Połóż się na ławce przodem w dół lub stój w opadzie. Lekkie hantle. Y: unieś ręce po skosie (30° od głowy). T: unieś ręce poziomo na boki. W: ugięte łokcie, rotacja zewnętrzna. Powolne i kontrolowane.",requiredEquipment:["dumbbells","bench"]},{id:"shoulders-20",name:"Lateral raise na wyciągu siedząc",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Unoszenie ramion bokiem na wyciągu w pozycji siedzącej. Wyciąg utrzymuje stałe napięcie przez cały zakres ruchu — skuteczniejsze dla izolacji bocznego barku niż hantle.",sets:3,reps:"12-15",restTime:45,notes:"Usiądź bokiem do wyciągu, chwyć linkę ręką zewnętrzną. Unieś ramię do poziomu barku trzymając łokieć lekko ugięty. Nie unoś barku przy ruchu. Powolna ekscentryka.",requiredEquipment:["cable_machine"]},{id:"shoulders-21",name:"Odwrotne rozpiętki z hantlami stojąc",muscleGroup:"Barki",difficulty:"Początkujący",description:"Unoszenie hantli w opadzie tułowia — celuje w tylny bark i środkowy czworoboczny. Niezbędne do zachowania symetrii z ćwiczeniami push.",sets:3,reps:"12-15",restTime:45,notes:"Tułów pochylony do przodu ok. 45-90°. Hantle zwisają przed ciałem. Unieś ramiona na boki do poziomu barków — wyobraź sobie że ściskasz ołówek między łopatkami. Kolana lekko ugięte.",requiredEquipment:["dumbbells"]},{id:"shoulders-22",name:"Wyciskanie jednostronne z kettlebell",muscleGroup:"Barki",difficulty:"Średniozaawansowany",description:"Jednostronne wyciskanie nad głowę z kettlebell w pozycji rack. Wymaga stabilizacji całego tułowia i angażuje barki, tricepsy oraz core w stopniu większym niż wyciskanie oburęczne.",sets:3,reps:"8-10 na rękę",restTime:75,notes:"Kettlebell w pozycji rack (na przedramieniu przy barku). Wyciśnij pionowo ku górze. Angażuj core przez cały czas. Nie wychylaj tułowia — to sygnał za dużego ciężaru.",requiredEquipment:["kettlebell"]},{id:"biceps-15",name:"Uginanie Zottman (zottman curl)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Uginanie z hantlami łączące supinację (w górę) z pronacją (w dół). Trenuje zarówno biceps jak i ramienno-promieniowy — pełniejszy rozwój całego ramienia.",sets:3,reps:"10-12",restTime:60,notes:"Uginaj z dłońmi ku górze (supinacja). Na szczycie obróć dłonie ku dołowi (pronacja). Opuszczaj powoli z dłońmi w dół. Na dole obróć z powrotem do supinacji. Kontrolowane tempo bez szarpania.",requiredEquipment:["dumbbells"]},{id:"biceps-16",name:"Bayesian curl (wyciąg za plecami)",muscleGroup:"Biceps",difficulty:"Średniozaawansowany",description:"Uginanie na wyciągu dolnym z ramieniem cofniętym za linię tułowia. Unikalny kąt rozciąga biceps — stymuluje wzrost części bliższej mięśnia niedostępny przy klasycznych uginaniach.",sets:3,reps:"12-15",restTime:60,notes:"Stań przodem do wyciągu, odejdź krok do przodu. Ramię lekko za tułowiem — to kluczowe dla efektu rozciągnięcia. Uginaj powoli czując rozciągnięcie bicepsa w dole. Nie ruszaj łokciem.",requiredEquipment:["cable_machine"]},{id:"biceps-17",name:"Uginanie ze sztangą wąskim chwytem",muscleGroup:"Biceps",difficulty:"Początkujący",description:"Uginanie ze sztangą z dłońmi bliżej siebie (10-15 cm rozstawu). Akcentuje zewnętrzną głowę bicepsa i brachialis — uzupełnia standardowe uginanie na szerokość barków.",sets:3,reps:"10-12",restTime:60,notes:"Chwyt nachwytem, dłonie 10-15 cm od siebie. Łokcie przy tułowiu przez cały ruch. Uginaj kontrolowanie — nie używaj zamachu tułowiem. Pełen zakres ruchu.",requiredEquipment:["barbell"]},{id:"triceps-16",name:"Skull crusher z hantlami",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Łamanie hantlami w leżeniu — popularniejsza i bezpieczniejsza wersja skull crushera niż ze sztangą. Każde ramię pracuje niezależnie, eliminując kompensację słabszej strony.",sets:3,reps:"10-12",restTime:75,notes:"Leżenie na ławce, hantle nad klatką, dłonie naprzeciwko siebie (neutralny chwyt). Opuszczaj hantle ku skroniom uginając łokcie — łokcie wskazują ku sufitowi. Nie szerz łokci na boki.",requiredEquipment:["dumbbells","bench"]},{id:"triceps-17",name:"Overhead triceps extension z liną",muscleGroup:"Triceps",difficulty:"Średniozaawansowany",description:"Prostowanie ramion nad głowę na wyciągu z liną. Pozycja nad głową maksymalnie rozciąga długą głowę tricepsa. Stałe napięcie wyciągu przez cały zakres ruchu.",sets:3,reps:"12-15",restTime:60,notes:"Stań tyłem do wyciągu, chwyć linę oburącz, pochyl tułów do przodu. Wyciągnij ręce nad głowę, łokcie przy uszach. Prostuj ramiona ku przodowi-górze. Powolna ekscentryka.",requiredEquipment:["cable_machine"]},{id:"triceps-18",name:"Diamond push-up z nogami uniesionymi",muscleGroup:"Triceps",difficulty:"Zaawansowany",description:"Pompki diamentowe z nogami uniesionymi na podwyższeniu. Przesunięcie środka ciężkości zwiększa obciążenie tricepsów i górnej klatki. Zaawansowana wariacja bez sprzętu.",sets:3,reps:"8-12",restTime:60,notes:"Nogi na ławce lub skrzyni, dłonie w kształcie diamentu pod klatką. Łokcie blisko ciała przy opuszczaniu. Im wyżej nogi, tym trudniejsze.",requiredEquipment:["bodyweight","bench"]},{id:"chest-23",name:"Pompki archer (archer push-up)",muscleGroup:"Klatka piersiowa",difficulty:"Zaawansowany",description:"Jednostronne pompki gdzie jedna ręka jest wyprostowana na boku a ciężar spoczywa głównie na drugiej. Przejście do pompki na jednej ręce — intensywne dla klatki i tricepsa.",sets:3,reps:"5-8 na stronę",restTime:90,notes:"Szeroki rozstaw rąk. Opuszczaj ciało ku jednej ręce trzymając drugą wyprostowaną. Wyprostowana ręka pozostaje na podłodze jako podpora. Stopniuj szerokość rozstawu zależnie od siły.",requiredEquipment:["bodyweight"]},{id:"chest-24",name:"Wyciskanie z pauzą (pause bench press)",muscleGroup:"Klatka piersiowa",difficulty:"Zaawansowany",description:"Wyciskanie sztangi z 2-3 sekundową pauzą na klatce. Eliminuje odruchy sprężynowania i wymusza czystą siłę koncentryczną. Kluczowe przy treningu siłowym i przebijaniu plateau.",sets:4,reps:"4-6",restTime:180,notes:"Opuść gryf na dolną część klatki. Zatrzymaj kontakt przez 2-3 sekundy — bez odprężania mięśni. Eksplozywny ruch ku górze po pauzie. Używaj 80-90% ciężaru zwykłego wyciskania.",requiredEquipment:["barbell","bench"]},{id:"chest-25",name:"Rozpiętki na maszynie (pec deck)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Izolacja klatki piersiowej na maszynie motylkowej. Bezpieczna i prosta w nauce — prowadnica wymusza poprawny tor ruchu. Idealna do nauki czucia klatki.",sets:3,reps:"12-15",restTime:60,notes:"Usiądź prosto, plecy przylegają do oparcia. Łokcie na poduszkach maszyny na wysokości barków. Złącz łokcie przed sobą ściskając klatkę. Powolny powrót — nie puszczaj nagle.",requiredEquipment:["cable_machine"]},{id:"back-25",name:"Podciąganie z obciążeniem (weighted pull-up)",muscleGroup:"Plecy",difficulty:"Zaawansowany",description:"Podciąganie z dodatkowym obciążeniem na pasie lub między nogami. Gdy podciągasz ponad 10 powtórzeń z masą ciała — to następny krok. Jeden z najlepszych wskaźników siły górnej partii.",sets:4,reps:"4-8",restTime:120,notes:"Użyj pasa z łańcuchem lub trzymaj hantlę między nogami. Pełen zakres — ramiona wyprostowane w dole, broda nad drążkiem na górze. Ściągaj łopatki przed inicjacją ruchu.",requiredEquipment:["pull_up_bar"]},{id:"back-26",name:"Wiosłowanie jednoręczne na wyciągu stojąc",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Jednostronne wiosłowanie na wyciągu dolnym w pozycji stojącej. Pozwala na pełną rotację tułowia i większy zakres ruchu — lepiej angażuje najszerszy i środkową część pleców.",sets:3,reps:"12-15 na stronę",restTime:60,notes:"Stań przodem do wyciągu. Ściągaj łokieć za tułów — poczuj ściśnięcie łopatki. Dozwolona naturalna rotacja tułowia. Pełne rozciągnięcie w dolnym punkcie.",requiredEquipment:["cable_machine"]},{id:"back-27",name:"Meadows row",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Wiosłowanie jednostronne ze sztangą landmine (koniec sztangi w rogu). Pozwala na ogromny zakres ruchu i intensywne zaangażowanie najszerszego grzbietu.",sets:3,reps:"10-12 na stronę",restTime:75,notes:"Ustaw koniec sztangi w narożniku. Stań bokiem, chwyć koniec sztangi zewnętrzną ręką. Ściągaj ku biodrowi cofając łokieć za linię tułowia. Rotacja tułowia jest dozwolona.",requiredEquipment:["barbell"]},{id:"back-28",name:"Seal row (wiosłowanie leżąc na ławce)",muscleGroup:"Plecy",difficulty:"Średniozaawansowany",description:"Wiosłowanie sztangą w leżeniu przodem na uniesieniu — eliminuje zamach tułowiem i izoluje plecy jak żadne inne ćwiczenie wiosłowania.",sets:3,reps:"10-12",restTime:90,notes:"Połóż się przodem na ławce ustawionej na podwyższeniu (tak żeby sztanga mogła swobodnie zwisać). Wiosłuj ściągając łokcie ku biodrach. Brak możliwości szarpania = czysta praca pleców.",requiredEquipment:["barbell","bench"]},{id:"core-26",name:"Spiderman plank",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Dynamiczna odmiana planku — z pozycji deski przyciągaj kolano do łokcia naprzemiennie. Angażuje skośne brzucha i stabilizatory rotacyjne.",sets:3,reps:"10 na stronę",restTime:45,notes:"Pozycja wysokiego planku (na dłoniach). Przyciągnij prawe kolano do prawego łokcia trzymając biodra poziomo. Wróć i powtórz na drugą stronę. Nie unoś bioder przy ruchu nogi.",requiredEquipment:["bodyweight"]},{id:"core-27",name:"Ab wheel rollout na kolanach",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Łatwiejsza wersja ab wheel rollout. Intensywna antyekstensja tułowia angażuje cały przód core — prosty brzucha, skośne, biodrowo-lędźwiowy.",sets:3,reps:"8-12",restTime:60,notes:"Klęcz na macie. Trzymaj kółko przed sobą. Turlaj do przodu kontrolowanie aż tułów będzie prawie równoległy do podłogi. Wciągnij pępek i wróć. Nie dopuszczaj do ugięcia w lędźwiach.",requiredEquipment:["bodyweight"]},{id:"core-28",name:"Unoszenie nóg na poręczach (captain's chair)",muscleGroup:"Brzuch",difficulty:"Średniozaawansowany",description:"Unoszenie nóg na krześle kapitańskim lub poręczach — jedno z najefektywniejszych ćwiczeń na dolną część brzucha i biodrowo-lędźwiowy.",sets:3,reps:"12-15",restTime:45,notes:"Podpórz się na przedramionach na poręczach. Unieś kolana do klatki lub nogi proste — im prostsze, tym trudniejsze. Kontrolowane opuszczanie — nie opuszczaj gwałtownie.",requiredEquipment:["dip_bars"]},{id:"fullbody-18",name:"Kettlebell Snatch (rwanie kettlebell)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Jednostronne dynamiczne ćwiczenie — zamach kettlebell z dołu do góry w jednym ruchu. Angażuje pośladki, plecy, barki i wymaga doskonałej koordynacji. Jedno z najbardziej kompleksowych ćwiczeń kettlebell.",sets:5,reps:"5 na rękę",restTime:90,notes:'Opanuj swing i clean zanim zaczniesz snatch. Kluczowy moment: "przebicie" ręki przez kettlebell w górze — dłoń obraca się wokół kulki, nie uderza w nią. Zacznij od lekkiego kettlebell.',requiredEquipment:["kettlebell"]},{id:"fullbody-19",name:"Kompleks ze sztangą (barbell complex)",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Seria ćwiczeń ze sztangą wykonywana bez odkładania. Klasyczny kompleks: deadlift → hang clean → front squat → push press × 6 powtórzeń każde. Masywne spalanie kalorii i kondycja.",sets:4,reps:"6 każde ćwiczenie",restTime:120,notes:"Użyj ciężaru jaki możesz wycisnąć nad głowę 8-10 razy. Płynne przejścia między ćwiczeniami. Idealne jako finisher lub trening kondycji.",requiredEquipment:["barbell"]},{id:"fullbody-20",name:"Swing jednoręczny z kettlebell",muscleGroup:"Całe ciało",difficulty:"Średniozaawansowany",description:"Jednostronna wersja swingu kettlebell — wymaga intensywniejszej stabilizacji core i angażuje rotatory kręgosłupa. Naturalne przejście do kettlebell snatch.",sets:4,reps:"10 na rękę",restTime:60,notes:"Technika identyczna jak w swingu obustronnym — ruch pochodzi z bioder. Wolna ręka dynamicznie odchyla się na bok dla równowagi. Zmień rękę po każdej serii.",requiredEquipment:["kettlebell"]},{id:"fullbody-21",name:"Wiosłowanie renegade ze sztangą",muscleGroup:"Całe ciało",difficulty:"Zaawansowany",description:"Wiosłowanie naprzemienne w pozycji pompki ze sztangą. Ekstremalnie angażuje core antyrotacyjnie, plecy i ramiona jednocześnie.",sets:3,reps:"5-6 na stronę",restTime:90,notes:"Pozycja pompki ze sztangą w szerokim chwycie. Wiosłuj jedną ręką trzymając biodra poziomo — nie rotuj. Szeroki rozstaw stóp dla stabilności.",requiredEquipment:["barbell"]},{id:"cardio-15",name:"Wiosłowanie interwałowe HIIT (ergometr)",muscleGroup:"Cardio",difficulty:"Zaawansowany",description:"Trening interwałowy na ergometrze wioślarskim — naprzemienne sprinty i odpoczynek. Angażuje 86% mięśni przy jednoczesnym treningu układu krążenia. Efekt EPOC jak przy biegu HIIT.",sets:1,reps:"",duration:20,restTime:0,notes:"5 min rozgrzewki → 8 rund: 250m sprint max effort / 60 sek odpoczynku → 5 min wyciszenia. Docelowe SPM przy sprincie: 32-36. Monitoruj wynik 250m — powinien być spójny w każdej rundzie.",requiredEquipment:["rowing_machine"]},{id:"cardio-16",name:"Stepping box (step aerobik)",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Wchodzenie i schodzenie ze stopnia w stałym rytmie. Niskoudarowe cardio angażujące nogi i pośladki. Idealne dla osób z problemami kolan lub jako aktywna regeneracja.",sets:1,reps:"",duration:20,restTime:0,notes:"Wysokość stopnia 15-30 cm. Wchódź krokiem naprzemiennym. Utrzymuj wyprostowaną postawę. Zwiększ intensywność dodając obciążenie lub tempo.",requiredEquipment:["bodyweight"]},{id:"cardio-17",name:"Broad jump (skok w dal z miejsca)",muscleGroup:"Cardio",difficulty:"Średniozaawansowany",description:"Eksplozywny skok w dal z miejsca. Trenuje moc nóg, koordynację i atletyczność. Świetny test i trening pliometryczny bez specjalistycznego sprzętu.",sets:4,reps:"5",duration:0,restTime:90,notes:"Stań ze stopami na szerokość barków. Cofnij ręce i zegnij kolana, eksplozywnie wyskocz do przodu wyrzucając ręce. Ląduj miękko z ugiętymi kolanami. Mierz odległość dla śledzenia postępów.",requiredEquipment:["bodyweight"]},{id:"cardio-18",name:"Skipping (bieg w miejscu z unoszeniem kolan)",muscleGroup:"Cardio",difficulty:"Początkujący",description:"Bieg w miejscu z dynamicznym unoszeniem kolan do poziomu bioder. Klasyczna rozgrzewka i ćwiczenie kardio bez potrzeby przestrzeni.",sets:4,reps:"30 sek",duration:10,restTime:30,notes:"Unoś kolana do poziomu bioder lub wyżej. Ramiona pracują naprzemiennie jak przy biegu. Ląduj na przodostopiu. Utrzymuj wyprostowaną postawę.",requiredEquipment:["bodyweight"]},{id:"mobility-1",name:"Rozciąganie mięśni piersiowych przy ścianie",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Statyczne rozciąganie klatki piersiowej przy ścianie. Niweluje skutki siedzenia i nadmiernego wyciskania — kluczowe dla zdrowia postawy.",sets:3,reps:"30-45 sek na stronę",restTime:15,notes:"Ramię na ścianie pod kątem 90°. Obróć ciało od ściany. Czuj rozciąganie w klatce i przednim barku. Oddychaj spokojnie, głęboko.",requiredEquipment:["bodyweight"]},{id:"mobility-2",name:"Rozciąganie zginaczy biodra",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Rozciąganie zginaczy biodra (iliopsoas, rectus femoris) — mięśni przykurczonych przy siedzącym trybie życia. Kluczowe dla głębokości przysiadu, postawy i zdrowia dolnego odcinka kręgosłupa.",sets:3,reps:"45-60 sek na stronę",restTime:15,notes:"Pozycja wykroku — tylne kolano na macie, przednia stopa daleko przed ciałem. Pchaj biodra do przodu i w dół. Podnieś ręce nad głowę dla głębszego rozciągnięcia. Oddychaj spokojnie, rozluźniaj się z każdym wydechem. Nie wyginaj lędźwi — napnij lekko brzuch.",requiredEquipment:["bodyweight"]},{id:"mobility-3",name:"Cat-Cow (mobilizacja kręgosłupa)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Mobilizacja kręgosłupa w czworakach — doskonała rozgrzewka i ćwiczenie terapeutyczne. Poprawia ruchomość odcinka piersiowego i lędźwiowego.",sets:3,reps:"10-15 cykli",restTime:15,notes:"Powoli, z pełnym zakresem ruchu. W cat: zaokrąglij cały kręgosłup i wciągnij pępek. W cow: ugnij kręgosłup, unieś głowę i ogon. Zsynchronizuj z oddechem.",requiredEquipment:["bodyweight"]},{id:"mobility-4",name:"Thoracic Rotation (rotacja piersiowa)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Ćwiczenie mobilności odcinka piersiowego kręgosłupa. Kompensuje ograniczenia rotacyjne i poprawia technikę wiosłowania i wyciskania.",sets:3,reps:"10 na stronę",restTime:15,notes:"Klęk podparty lub leżenie bokiem z ugiętymi nogami. Górną ręką otwieraj klatkę ku górze. Wzrok za ręką. Ruch płynny, bez szarpania.",requiredEquipment:["bodyweight"]},{id:"smith-1",name:"Wyciskanie na ławce poziomej (Smith Machine)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Wyciskanie na poziomej ławce na prowadnicy Smitha. Prowadnica stabilizuje gryf, co pozwala skupić się na technice i bezpiecznie trenować bez spottera. Idealne dla początkujących i rehabilitacji.",sets:4,reps:"8-12",restTime:90,notes:"Gryf opuszczaj kontrolowanie na środek klatki. Stopy płasko na podłodze, łopatki ściągnięte. Pamiętaj o zabezpieczeniu zatrzasków przed każdą serią.",requiredEquipment:["smith_machine","bench"]},{id:"smith-2",name:"Wyciskanie skośne (Smith Machine)",muscleGroup:"Klatka piersiowa",difficulty:"Początkujący",description:"Wyciskanie skośne na górną klatkę piersiową na prowadnicy Smitha. Bezpieczna alternatywa dla wyciskania ze sztangą na ławce skośnej.",sets:3,reps:"10-12",restTime:75,notes:"Kąt ławki 30-45°. Gryf prowadź po lekkim łuku ku górze klatki. Nie blokuj łokci w górnym punkcie.",requiredEquipment:["smith_machine","bench"]},{id:"smith-3",name:"Przysiad ze Smith Machine",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Przysiad na prowadnicy Smitha. Prowadnica wymusza pionowy tor ruchu, co zmniejsza wymogi dotyczące mobilności i pozwala skupić się na czworogłowych. Bezpieczny wariant dla początkujących.",sets:4,reps:"10-15",restTime:90,notes:"Stopy lekko przed linią bioder (bardziej do przodu niż przy klasycznym przysiada). Kolana w linii palców. Nie blokuj kolan w górnym punkcie — utrzymuj lekkie napięcie mięśni.",requiredEquipment:["smith_machine"]},{id:"smith-4",name:"Wyciskanie żołnierskie (Smith Machine)",muscleGroup:"Barki",difficulty:"Początkujący",description:"Wyciskanie nad głowę na prowadnicy Smitha. Prowadnica stabilizuje ruch, co pozwala skupić się na deltoidiach bez angażowania stabilizatorów. Dobre ćwiczenie dla osób z ograniczoną mobilnością barku.",sets:3,reps:"10-12",restTime:75,notes:"Siedząc lub stojąc. Gryf opuszczaj przed twarzą (nie za głowę — ryzyko dla szyjki kręgosłupa). Łokcie lekko przed linią ciała w dolnym punkcie.",requiredEquipment:["smith_machine"]},{id:"smith-5",name:"Martwy ciąg rumuński (Smith Machine)",muscleGroup:"Nogi",difficulty:"Początkujący",description:"Martwy ciąg rumuński na prowadnicy Smitha. Świetne ćwiczenie do nauki wzorca zawiasowego (hip hinge) bez ryzyka utraty kontroli nad gryfem. Angażuje dwugłowe uda i pośladki.",sets:3,reps:"12-15",restTime:75,notes:"Nogi na szerokość bioder. Pchaj biodra do tyłu opuszczając gryf wzdłuż nóg. Kręgosłup neutralny przez cały ruch. Czuj rozciąganie w dwugłowych na dole.",requiredEquipment:["smith_machine"]},{id:"smith-6",name:"Wiosłowanie podchwytem (Smith Machine)",muscleGroup:"Plecy",difficulty:"Początkujący",description:"Wiosłowanie w opadzie tułowia podchwytem na prowadnicy Smitha. Prowadnica ułatwia utrzymanie pozycji i izoluje plecy. Angażuje głównie dolną część najszerszego i biceps.",sets:3,reps:"10-12",restTime:75,notes:"Tułów równoległy do podłogi lub lekko powyżej. Prowadź łokcie blisko ciała. Ściągaj gryf do dolnego brzucha. Pełne rozciągnięcie w dolnym punkcie.",requiredEquipment:["smith_machine"]},{id:"smith-7",name:"Hip Thrust (Smith Machine)",muscleGroup:"Nogi",difficulty:"Średniozaawansowany",description:"Hip thrust na prowadnicy Smitha. Maszyna zapewnia stały tor ruchu i łatwe zdejmowanie/nakładanie obciążenia. Jedno z najlepszych ćwiczeń na pośladki.",sets:4,reps:"10-15",restTime:90,notes:"Barki na ławce, gryf przez biodra z matą ochronną. W górnym punkcie biodra równoległe do podłogi — nie przeprostowuj lędźwi. Napnij mocno pośladki na szczycie ruchu.",requiredEquipment:["smith_machine","bench"]},{id:"smith-8",name:"Wykroki (Smith Machine)",muscleGroup:"Nogi",d
